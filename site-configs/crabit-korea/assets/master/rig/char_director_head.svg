<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- LAYER 1: NECK -->
  <g id="part-director-neck" data-pivot="150 235">
    <!-- Soft Cylindrical Neck Support -->
    <path id="neck-base" d="M 128 190 L 128 235 Q 150 242 172 235 L 172 190 Z" fill="#F6D6BA"/>
    <!-- Jaw Shadow -->
    <path id="neck-jaw-shadow" d="M 128 190 Q 150 205 172 190 Q 150 215 128 190 Z" fill="#E2B380"/>
  </g>

  <!-- LAYER 2: EARS -->
  <g id="part-director-ears">
    <!-- Left Ear (tucked neatly against skull) -->
    <path id="ear-left" d="M 108 140 C 98 140 98 175 108 175 Z" fill="#F6D6BA" stroke="#E2B380" stroke-width="1"/>
    <path d="M 106 148 C 103 152 103 162 106 166" stroke="#E2B380" stroke-width="1" fill="none" stroke-linecap="round"/>
    <!-- Right Ear (tucked neatly against skull) -->
    <path id="ear-right" d="M 192 140 C 202 140 202 175 192 175 Z" fill="#F6D6BA" stroke="#E2B380" stroke-width="1"/>
    <path d="M 194 148 C 197 152 197 162 194 166" stroke="#E2B380" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>

  <!-- LAYER 3: FACE BASE -->
  <g id="part-director-head-base">
    <!-- Gentle, handsome masculine oval with broad soft chin -->
    <path id="face-base" d="M 108 120 C 108 70 192 70 192 120 C 192 165 175 195 150 195 C 125 195 108 165 108 120 Z" fill="#F6D6BA"/>
  </g>

  <!-- LAYER 4: FACIAL FEATURES -->
  <g id="part-director-face-details">
    <!-- Left Eye Assembly -->
    <g id="eye-left">
      <path d="M 122 146 Q 133 141 144 146" stroke="#111827" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M 124 140 Q 133 138 142 140" stroke="#C88D68" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="133" cy="149" rx="4.5" ry="5" fill="#111827"/>
      <circle cx="135" cy="147" r="1.5" fill="#FFFFFF"/>
      <path d="M 125 154 Q 133 156 141 154" stroke="#E2B380" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- Right Eye Assembly -->
    <g id="eye-right">
      <path d="M 156 146 Q 167 141 178 146" stroke="#111827" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M 158 140 Q 167 138 176 140" stroke="#C88D68" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="167" cy="149" rx="4.5" ry="5" fill="#111827"/>
      <circle cx="169" cy="147" r="1.5" fill="#FFFFFF"/>
      <path d="M 159 154 Q 167 156 175 154" stroke="#E2B380" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- Eyebrows (Calm, horizontal, masculine) -->
    <path id="eyebrow-left" d="M 120 136 Q 133 133 145 137" stroke="#1E2430" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path id="eyebrow-right" d="M 155 137 Q 167 133 180 136" stroke="#1E2430" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Nose (Clean minimal L-mark) -->
    <path id="nose" d="M 150 156 L 148 168 L 153 169" stroke="#D97706" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Mouth (Warm, reassuring mentor smile) -->
    <path id="mouth" d="M 138 180 Q 150 186 162 180" stroke="#9A3412" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path id="mouth-lower-shadow" d="M 146 186 Q 150 188 154 186" stroke="#E2B380" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- LAYER 5: GLASSES -->
  <g id="part-director-glasses">
    <!-- Frames -->
    <rect x="120" y="139" width="26" height="20" rx="3" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="154" y="139" width="26" height="20" rx="3" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Center Bridge -->
    <line x1="146" y1="147" x2="154" y2="147" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Temples to Ears -->
    <line x1="120" y1="147" x2="108" y2="147" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="180" y1="147" x2="192" y2="147" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Diagonal Lens Glares -->
    <polygon points="122,141 130,141 125,155 122,155" fill="#FFFFFF" opacity="0.35"/>
    <polygon points="156,141 164,141 159,155 156,155" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- LAYER 6: 7/3 PARTED HAIR -->
  <g id="part-director-hair">
    <!-- Back Hair Volume Contour -->
    <path id="hair-back"
      d="M 106 142
         C 100 120 102 95 115 82
         C 125 72 138 70 150 70
         C 165 70 180 75 188 85
         C 198 98 198 122 194 142
         L 192 135
         C 192 110 182 95 168 85
         C 156 78 142 78 132 85
         C 118 95 108 110 108 135 Z"
      fill="#151922"/>

    <!-- 7/3 Side-Parted Hair Volume Framing Forehead naturally -->
    <!-- Forehead height is exactly ~30px above eyebrow line (eyebrow at y=136, hairline arches from y=108 to 118) -->
    <path id="hair-main"
      d="M 106 135
         C 104 110 106 88 122 76
         C 134 68 148 68 160 70
         C 174 72 186 78 192 88
         C 198 98 196 118 194 135
         C 192 125 188 112 180 106
         C 170 98 158 98 146 102
         C 138 105 135 115 134 118
         C 130 112 122 108 114 112
         C 108 116 107 125 106 135 Z"
      fill="#1E2430"/>

    <!-- 7/3 Part Seam Accent & Flow Strands -->
    <path d="M 134 118 C 135 105 138 92 144 80" stroke="#475569" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 148 102 C 160 102 172 106 182 112" stroke="#475569" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 125 108 C 118 110 114 116 110 124" stroke="#475569" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.8"/>

    <!-- Distinguished Subtle Temple Silver Accents -->
    <path d="M 107 122 L 109 130" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 193 122 L 191 130" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>