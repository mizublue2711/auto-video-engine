<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" width="856" height="540" id="ui_crabit_card_base_master">
  <defs>
    <!-- Base Card Gradient: Deep Midnight Navy (#0F172A) to Electric Cyan (#00E5FF) -->
    <linearGradient id="card_bg_gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="42%" stop-color="#0F172A" />
      <stop offset="72%" stop-color="#0369A1" />
      <stop offset="92%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Cel-Shaded Facet Gradient 1 -->
    <linearGradient id="facet_cyan_glow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </linearGradient>

    <!-- Cel-Shaded Facet Gradient 2 -->
    <linearGradient id="facet_sweep_glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.30" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </linearGradient>

    <!-- Metallic Gold EMV Chip Gradients (#F59E0B and #FEF3C7) -->
    <linearGradient id="emv_chip_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="28%" stop-color="#FDE68A" />
      <stop offset="68%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="emv_center_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Outer Card Precision Rim Border Gradient -->
    <linearGradient id="card_rim_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#1E293B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.7" />
    </linearGradient>

    <!-- Watermark Diamond Refractive Gradient -->
    <linearGradient id="watermark_diamond_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#00E5FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08" />
    </linearGradient>

    <!-- Hologram Security Badge Gradient -->
    <linearGradient id="hologram_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#E0F7FA" stop-opacity="0.6" />
    </linearGradient>

    <!-- Card Clip Path: Standard ISO/IEC 7810 ID-1 (856 x 540, rx=28) -->
    <clipPath id="card_clip">
      <rect x="0" y="0" width="856" height="540" rx="28" />
    </clipPath>
  </defs>

  <!-- ========================================================================= -->
  <!-- 1. CLIPPED CARD CONTAINER                                                -->
  <!-- ========================================================================= -->
  <g id="card_body" clip-path="url(#card_clip)">

    <!-- Primary Base: Midnight Navy to Electric Cyan -->
    <rect id="card_base_fill" x="0" y="0" width="856" height="540" fill="url(#card_bg_gradient)" />

    <!-- ======================================================================= -->
    <!-- 2. HIGH-CONTRAST 2D CEL-SHADED GEOMETRIC FACETS & TEXTURE               -->
    <!-- ======================================================================= -->
    <g id="cel_shaded_facets">
      <!-- Dark Lower-Left Contrast Shadow Wedges -->
      <polygon points="0,360 0,540 280,540" fill="#0B1120" fill-opacity="0.75" />
      <polygon points="0,430 0,540 170,540" fill="#060913" fill-opacity="0.8" />
      <line x1="0" y1="360" x2="280" y2="540" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.25" />

      <!-- Cel Facet: Mid-Card Diagonal Angular Band -->
      <polygon points="340,540 856,230 856,380 570,540" fill="url(#facet_sweep_glow)" />

      <!-- Cel Facet: Cyan Energy Sector Top Right -->
      <polygon points="480,0 856,0 856,320 640,160" fill="url(#facet_cyan_glow)" />

      <!-- High-Contrast Cel Blade 1 (Sharp Primary Cyan Sweep) -->
      <polygon points="290,540 345,540 856,165 856,125" fill="#00E5FF" fill-opacity="0.18" />

      <!-- High-Contrast Cel Blade 2 (Intense Electric Cyan Hairline Accent) -->
      <polygon points="360,540 374,540 856,192 856,182" fill="#00E5FF" fill-opacity="0.65" />

      <!-- Angular Cel Shadow Step -->
      <polygon points="856,0 856,140 730,40" fill="#0284C7" fill-opacity="0.2" />

      <!-- Precision Cel Top-Rim Accent Beam -->
      <polygon points="120,0 856,0 856,14 180,14" fill="#00E5FF" fill-opacity="0.4" />

      <!-- Geometric Circuit Grid Lines (Clean Pure Vector Guides) -->
      <g id="vector_grid_lines" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.15">
        <line x1="80" y1="170" x2="856" y2="170" />
        <line x1="80" y1="360" x2="856" y2="360" />
        <line x1="420" y1="80" x2="420" y2="480" />
        <line x1="610" y1="80" x2="610" y2="480" />
      </g>
    </g>

    <!-- ======================================================================= -->
    <!-- 3. BRANDING: SUBTLE CARAT CRYSTAL DIAMOND WATERMARK (TOP-RIGHT)         -->
    <!-- ======================================================================= -->
    <g id="branding_watermark" transform="translate(670, 75)">
      <!-- Radial Halo Ring Watermark -->
      <circle cx="55" cy="55" r="76" fill="none" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.16" stroke-dasharray="6 4" />
      <circle cx="55" cy="55" r="92" fill="none" stroke="#00E5FF" stroke-width="0.8" stroke-opacity="0.1" />

      <!-- Carat Faceted Diamond Watermark Shape -->
      <g id="carat_diamond_geometry">
        <!-- Table Facet (Top Center Polygon) -->
        <polygon points="32,24 78,24 66,44 44,44" fill="url(#watermark_diamond_grad)" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.32" />

        <!-- Crown Star & Kite Facets -->
        <polygon points="32,24 44,44 14,44" fill="#00E5FF" fill-opacity="0.12" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.32" />
        <polygon points="78,24 96,44 66,44" fill="#00E5FF" fill-opacity="0.15" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.32" />
        <polygon points="14,44 32,24 4,32" fill="#E0F7FA" fill-opacity="0.1" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.25" />
        <polygon points="96,44 78,24 106,32" fill="#E0F7FA" fill-opacity="0.12" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.25" />

        <!-- Girdle Facets -->
        <polygon points="4,32 14,44 55,44 4,44" fill="#00E5FF" fill-opacity="0.08" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.25" />
        <polygon points="106,32 96,44 55,44 106,44" fill="#00E5FF" fill-opacity="0.1" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.25" />

        <!-- Lower Pavilion Facets Converging to Apex / Culet (55, 96) -->
        <polygon points="4,44 14,44 55,96" fill="#0284C7" fill-opacity="0.16" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.32" />
        <polygon points="14,44 44,44 55,96" fill="#00E5FF" fill-opacity="0.2" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.32" />
        <polygon points="44,44 66,44 55,96" fill="#E0F7FA" fill-opacity="0.28" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.38" />
        <polygon points="66,44 96,44 55,96" fill="#00E5FF" fill-opacity="0.22" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.32" />
        <polygon points="96,44 106,44 55,96" fill="#0284C7" fill-opacity="0.18" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.32" />

        <!-- Diamond Peak Sparkle Points -->
        <circle cx="55" cy="44" r="2.5" fill="#FFFFFF" fill-opacity="0.6" />
        <circle cx="55" cy="96" r="2" fill="#00E5FF" fill-opacity="0.8" />
      </g>

      <!-- Watermark Carat Label -->
      <text x="55" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="3" fill="#00E5FF" fill-opacity="0.45">CARAT</text>
    </g>

    <!-- ======================================================================= -->
    <!-- 4. BRAND TYPOGRAPHY & HEADER METRICS                                    -->
    <!-- ======================================================================= -->
    <g id="brand_header">
      <!-- Crabit Monogram / Wordmark -->
      <text x="75" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="4" fill="#00E5FF">CRABIT</text>
      <!-- Sub-label Tier -->
      <text x="215" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#94A3B8">FINTECH REWARD PLATINUM</text>

      <!-- Decorative Mini Diamond Icon beside Monogram -->
      <polygon points="56,76 63,68 70,76 63,84" fill="#00E5FF" stroke="#E0F7FA" stroke-width="1" />
    </g>

    <!-- ======================================================================= -->
    <!-- 5. EMV CHIP GEOMETRY (EXACT: x="120" y="210" width="140" height="110")  -->
    <!-- ======================================================================= -->
    <g id="emv_chip_assembly">
      <!-- Outer Metallic Gold Contact Base (rx="12") -->
      <rect id="emv_chip_base" x="120" y="210" width="140" height="110" rx="12" fill="url(#emv_chip_gold)" stroke="#B45309" stroke-width="1.8" />

      <!-- Beveled Inner Border Highlight Line (#FEF3C7) -->
      <rect x="123" y="213" width="134" height="104" rx="10" fill="none" stroke="#FEF3C7" stroke-width="1.2" stroke-opacity="0.9" />

      <!-- 2D Cel-Shaded Diagonal Metallic Sheen Across Chip -->
      <polygon points="120,235 155,210 190,210 120,280" fill="#FFFFFF" fill-opacity="0.22" />
      <polygon points="175,210 205,210 120,300 120,270" fill="#FFFFFF" fill-opacity="0.12" />

      <!-- Center Contact Pad Geometry (x="165" y="245" width="50" height="40" rx="6") -->
      <rect x="165" y="245" width="50" height="40" rx="6" fill="url(#emv_center_gold)" stroke="#B45309" stroke-width="1.8" />
      <rect x="167" y="247" width="46" height="36" rx="4.5" fill="none" stroke="#FEF3C7" stroke-width="1.4" stroke-opacity="0.95" />

      <!-- EMV Isolation Tracks / Channels: Deep Gold Grooves with Metallic Gold (#FEF3C7) Highlights -->
      <!-- Left Upper Contact Track -->
      <path d="M 120,238 L 152,238 L 165,248" fill="none" stroke="#B45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 120,237 L 152,237 L 165,247" fill="none" stroke="#FEF3C7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Left Lower Contact Track -->
      <path d="M 120,292 L 152,292 L 165,282" fill="none" stroke="#B45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 120,293 L 152,293 L 165,283" fill="none" stroke="#FEF3C7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Right Upper Contact Track -->
      <path d="M 260,238 L 228,238 L 215,248" fill="none" stroke="#B45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 260,237 L 228,237 L 215,247" fill="none" stroke="#FEF3C7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Right Lower Contact Track -->
      <path d="M 260,292 L 228,292 L 215,282" fill="none" stroke="#B45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 260,293 L 228,293 L 215,283" fill="none" stroke="#FEF3C7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Top Vertical Isolation Divider -->
      <line x1="190" y1="210" x2="190" y2="245" stroke="#B45309" stroke-width="3" />
      <line x1="189" y1="210" x2="189" y2="245" stroke="#FEF3C7" stroke-width="1.4" />

      <!-- Bottom Vertical Isolation Divider -->
      <line x1="190" y1="285" x2="190" y2="320" stroke="#B45309" stroke-width="3" />
      <line x1="189" y1="285" x2="189" y2="320" stroke="#FEF3C7" stroke-width="1.4" />

      <!-- Center Pad Horizontal Split Slot -->
      <line x1="172" y1="265" x2="208" y2="265" stroke="#B45309" stroke-width="2.2" stroke-linecap="round" />
      <line x1="172" y1="266" x2="208" y2="266" stroke="#FEF3C7" stroke-width="1.2" stroke-linecap="round" />

      <!-- Golden Precision Micro-Pads inside Chip Cells -->
      <circle cx="138" cy="225" r="2.5" fill="#FEF3C7" />
      <circle cx="242" cy="225" r="2.5" fill="#FEF3C7" />
      <circle cx="138" cy="305" r="2.5" fill="#FEF3C7" />
      <circle cx="242" cy="305" r="2.5" fill="#FEF3C7" />
    </g>

    <!-- ======================================================================= -->
    <!-- 6. CONTACTLESS PAYMENT SYMBOL (NFC WAVE)                                -->
    <!-- ======================================================================= -->
    <g id="contactless_indicator" transform="translate(290, 240)">
      <path d="M 0,10 A 18,18 0 0,1 0,40" fill="none" stroke="#00E5FF" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.85" />
      <path d="M 8,4 A 26,26 0 0,1 8,46" fill="none" stroke="#00E5FF" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.65" />
      <path d="M 16,-2 A 34,34 0 0,1 16,52" fill="none" stroke="#00E5FF" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.45" />
      <path d="M 24,-8 A 42,42 0 0,1 24,58" fill="none" stroke="#00E5FF" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.25" />
    </g>

    <!-- ======================================================================= -->
    <!-- 7. FINTECH CARD NUMBER & EMBOSSED PLACEHOLDER TRACKS                    -->
    <!-- ======================================================================= -->
    <g id="card_account_track">
      <!-- Stylized 16-Digit Fintech Number Tokens -->
      <g id="card_digits" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="700" letter-spacing="4" fill="#E2E8F0">
        <text x="120" y="380">5428</text>
        <text x="235" y="380">8901</text>
        <text x="350" y="380">2345</text>
        <text x="465" y="380">8829</text>
      </g>

      <!-- Account Metadata Labels -->
      <text x="120" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#64748B">CARDHOLDER NAME</text>
      <text x="120" y="466" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" letter-spacing="2" fill="#F8FAFC">CRABIT SCHOLAR REWARD</text>

      <text x="465" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#64748B">VALID THRU</text>
      <text x="465" y="466" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" letter-spacing="2" fill="#F8FAFC">12/29</text>
    </g>

    <!-- ======================================================================= -->
    <!-- 8. HOLOGRAPHIC SECURITY COIN / BADGE (BOTTOM-RIGHT)                     -->
    <!-- ======================================================================= -->
    <g id="hologram_security_badge" transform="translate(710, 440)">
      <!-- Dual Interlocking Security Rings -->
      <circle cx="-16" cy="0" r="28" fill="#00E5FF" fill-opacity="0.25" stroke="#00E5FF" stroke-width="1.5" />
      <circle cx="16" cy="0" r="28" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1.5" />
      <!-- Center Interlocking Cut Highlight -->
      <path d="M 0,-23 A 28,28 0 0,1 0,23 A 28,28 0 0,1 0,-23" fill="url(#hologram_grad)" stroke="#E0F7FA" stroke-width="1.2" stroke-opacity="0.8" />
      <polygon points="0,-10 8,0 0,10 -8,0" fill="#FFFFFF" fill-opacity="0.75" />
    </g>

  </g>

  <!-- ========================================================================= -->
  <!-- 9. OUTER CARD BEVEL & RIM HIGHLIGHT BORDER                                -->
  <!-- ========================================================================= -->
  <rect id="card_outer_border" x="1" y="1" width="854" height="538" rx="27" fill="none" stroke="url(#card_rim_border)" stroke-width="2" />
</svg>
