<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" id="svg_crabit_phone_carats" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gem_blue_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- Group 1: Device Chassis & Bezel -->
  <g id="device_frame_group">
     <rect id="device_shadow" x="120" y="120" width="560" height="1000" rx="60" fill="#0F172A" opacity="0.12" />
     <rect id="device_outer_bezel" x="100" y="80" width="600" height="1040" rx="54" fill="#1E293B" />
     <rect id="device_screen_bg" x="120" y="100" width="560" height="1000" rx="42" fill="#F8FAFC" />
     <rect id="device_notch" x="330" y="115" width="140" height="26" rx="13" fill="#0F172A" />
  </g>

  <!-- Group 2: Crabit Header UI -->
  <g id="ui_header">
     <text id="brand_title" x="160" y="210" fill="#0F172A" font-size="32" font-weight="900" letter-spacing="1" font-family="system-ui, -apple-system, sans-serif">CRABIT</text>
     <!-- Top right: Carat Gem pill badge -->
     <g id="ui_header_carat_pill">
        <rect x="500" y="175" width="140" height="48" rx="24" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2" />
        <!-- Faceted Carat Diamond Icon -->
        <polygon id="carat_mini_gem" points="525,190 535,182 545,190 535,208" fill="#00E5FF" stroke="#0284C7" stroke-width="1.5" />
        <text x="555" y="206" fill="#1E3A8A" font-size="20" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">1,250</text>
     </g>
  </g>

  <!-- Group 3: Hero Scholarship Card with Gemstone Theme -->
  <g id="ui_hero_wallet_card">
     <rect id="wallet_card_bg" x="150" y="260" width="500" height="250" rx="28" fill="url(#gem_blue_gradient)" />
     <text id="wallet_label" x="190" y="315" fill="#BFDBFE" font-size="22" font-weight="600" font-family="system-ui, -apple-system, sans-serif">나의 누적 캐럿 (Accumulated Carats)</text>

     <!-- Large Diamond Carat Token Emblem -->
     <g id="hero_carat_gemstone" transform="translate(510, 310)">
        <polygon points="60,10 90,35 75,85 45,85 30,35" fill="#38BDF8" />
        <polygon points="60,10 75,85 45,85" fill="#0284C7" opacity="0.6" />
        <polygon points="60,10 90,35 75,85" fill="#BAE6FD" opacity="0.8" />
        <!-- Glint sparkle -->
        <circle cx="85" cy="20" r="4" fill="#FFFFFF" />
     </g>
     <text id="wallet_carat_value" x="190" y="385" fill="#FFFFFF" font-size="48" font-weight="900" font-family="system-ui, -apple-system, sans-serif">50,000 <tspan font-size="28" font-weight="600">Carats</tspan></text>
     <text id="wallet_krw_equiv" x="190" y="440" fill="#93C5FD" font-size="20" font-family="system-ui, -apple-system, sans-serif">≈ 50,000원 장학금 전환 가능</text>
  </g>

  <!-- Group 4: Mission Completed Action Card (Triggers the Student's Awe) -->
  <g id="ui_mission_card_active">
     <rect x="150" y="540" width="500" height="130" rx="24" fill="#FFFFFF" stroke="#E0E7FF" stroke-width="2" />
     <circle cx="215" cy="605" r="32" fill="#E0F2FE" />
     <polygon id="mission_reward_gem" points="215,585 230,598 222,620 208,620 200,598" fill="#0EA5E9" />
     <text x="270" y="595" fill="#0F172A" font-size="22" font-weight="700" font-family="system-ui, -apple-system, sans-serif">오늘의 학습 미션 완료!</text>
     <text x="270" y="630" fill="#0284C7" font-size="18" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">+ 500 Carats 즉시 지급</text>
  </g>

  <!-- Group 5: Unified Hero Student Hand Holding Phone (Exact Visual Vector DNA) -->
  <g id="student_hand_holding_phone">
     <!-- Sleeve Originating from Bottom-Right (Royal Blue #2563EB) -->
     <path id="holding_arm_sleeve" fill="#2563EB" d="M 540,1200 L 760,1050 L 800,1110 L 640,1200 Z" />

     <!-- Ribbed Wrist Cuff (#1D4ED8) -->
     <rect id="holding_wrist_cuff" x="600" y="1030" width="130" height="34" rx="10" fill="#1D4ED8" stroke="#1E40AF" stroke-width="2" transform="rotate(-32 665 1047)" />

     <!-- Tapered Wrist & Palm Base (#FFE3D1 With Contour #E2A888) -->
     <path id="holding_palm_wrist" fill="#FFE3D1" stroke="#E2A888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 645,1030 C 670,980 685,920 670,860 L 695,845 C 720,910 705,980 675,1045 Z" />

     <!-- Supporting Fingers Wrapping Right Chassis Bezel (Behind Screen, On Top of Bezel) -->
     <!-- Pinky Finger -->
     <path id="finger_hold_pinky" fill="#FFE3D1" stroke="#E2A888" stroke-width="2" stroke-linecap="round" d="M 690,920 C 708,920 714,905 700,895 C 688,890 678,895 675,905 Z" />
     <!-- Ring Finger -->
     <path id="finger_hold_ring" fill="#FFE3D1" stroke="#E2A888" stroke-width="2" stroke-linecap="round" d="M 685,885 C 705,885 712,870 698,860 C 686,855 675,860 672,870 Z" />
     <!-- Middle Finger -->
     <path id="finger_hold_middle" fill="#FFE3D1" stroke="#E2A888" stroke-width="2" stroke-linecap="round" d="M 682,850 C 704,850 710,835 696,825 C 684,820 672,825 670,835 Z" />
     <!-- Index Finger -->
     <path id="finger_hold_index" fill="#FFE3D1" stroke="#E2A888" stroke-width="2" stroke-linecap="round" d="M 678,815 C 700,815 706,800 692,790 C 680,785 668,790 666,800 Z" />

     <!-- Ergonomic Thumb Gripping Front Bezel at 35° Natural Angle (Does Not Obscure Active Screen UI) -->
     <g id="holding_thumb_group" transform="translate(620, 860) rotate(-35)">
        <!-- Thumb Body -->
        <rect id="thumb_body" x="0" y="0" width="70" height="34" rx="14" fill="#FFE3D1" stroke="#E2A888" stroke-width="2" />
        <!-- Joint Accent Line (#FDBA74) -->
        <line x1="28" y1="4" x2="28" y2="30" stroke="#FDBA74" stroke-width="2" stroke-linecap="round" />
        <!-- Soft Thumb Tip Highlight -->
        <circle cx="56" cy="17" r="6" fill="#FFFFFF" opacity="0.4" />
     </g>

     <!-- Soft Joint & Crease Shadow Lines (#FDBA74) -->
     <path d="M 665,960 Q 655,930 660,900" stroke="#FDBA74" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>
</svg>