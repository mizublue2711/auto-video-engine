<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" id="svg_crabit_phone_hero" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Faceted Gem Linear Gradient for Scholarship Wallet Card -->
    <linearGradient id="gem_blue_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Subtle Radial Glow for Ambient Touch Impact -->
    <radialGradient id="touch_radial_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ======================================================================== -->
  <!-- 1. BACKDROP GLOW LAYER                                                   -->
  <!-- ======================================================================== -->
  <g id="backdrop_glow">
    <!-- Clean Canvas Background -->
    <rect width="1200" height="1600" fill="#F8FAFC" />

    <!-- Subtle Ambient Circular Glow Centered Behind Device -->
    <circle cx="600" cy="705" r="480" fill="#3B82F6" opacity="0.05" />

    <!-- Ambient Micro Sparkles -->
    <circle cx="200" cy="360" r="4" fill="#38BDF8" opacity="0.7" />
    <circle cx="1000" cy="400" r="5" fill="#F59E0B" opacity="0.7" />
    <circle cx="180" cy="920" r="3.5" fill="#10B981" opacity="0.6" />
    <circle cx="1020" cy="880" r="4" fill="#00E5FF" opacity="0.7" />
  </g>

  <!-- ======================================================================== -->
  <!-- 2. LEFT HAND FINGERS BEHIND PHONE (WRAPPING FROM BACK CHASSIS)           -->
  <!-- ======================================================================== -->
  <g id="left_hand_fingers_behind_phone">
    <!-- 4 Supporting Fingertips Peeking Out Behind Right Chassis (x=870..896, y=700..920) -->
    <!-- Index Fingertip -->
    <path id="left_finger_index_back" fill="#FFE3D1" stroke="#E2A888" stroke-width="2.5" stroke-linecap="round" d="M 870,705 C 892,705 896,725 888,745 C 880,752 870,752 870,745 Z" />
    <line x1="875" y1="725" x2="888" y2="725" stroke="#FDBA74" stroke-width="2" stroke-linecap="round" />

    <!-- Middle Fingertip -->
    <path id="left_finger_middle_back" fill="#FFE3D1" stroke="#E2A888" stroke-width="2.5" stroke-linecap="round" d="M 870,755 C 896,755 900,775 892,798 C 884,805 870,805 870,798 Z" />
    <line x1="875" y1="775" x2="892" y2="775" stroke="#FDBA74" stroke-width="2" stroke-linecap="round" />

    <!-- Ring Fingertip -->
    <path id="left_finger_ring_back" fill="#FFE3D1" stroke="#E2A888" stroke-width="2.5" stroke-linecap="round" d="M 870,810 C 894,810 898,832 890,852 C 882,858 870,858 870,852 Z" />
    <line x1="875" y1="832" x2="890" y2="832" stroke="#FDBA74" stroke-width="2" stroke-linecap="round" />

    <!-- Pinky Fingertip -->
    <path id="left_finger_pinky_back" fill="#FFE3D1" stroke="#E2A888" stroke-width="2.5" stroke-linecap="round" d="M 870,865 C 890,865 894,885 886,905 C 878,912 870,912 870,905 Z" />
    <line x1="874" y1="885" x2="886" y2="885" stroke="#FDBA74" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ======================================================================== -->
  <!-- 3. PHONE BODY & SCREEN UI (CENTER STAGE: x=330, y=180, w=540, h=1050)    -->
  <!-- ======================================================================== -->
  <g id="phone_body_and_screen_ui">
    <!-- Phone Drop Shadow -->
    <rect id="phone_shadow" x="345" y="195" width="540" height="1050" rx="54" fill="#0F172A" opacity="0.16" />

    <!-- Outer Phone Chassis & Bezel -->
    <rect id="phone_chassis_bezel" x="330" y="180" width="540" height="1050" rx="54" fill="#1E293B" stroke="#0F172A" stroke-width="4" />

    <!-- Screen Glass Inset -->
    <rect id="phone_screen_glass" x="344" y="194" width="512" height="1022" rx="42" fill="#F8FAFC" />

    <!-- Camera Notch / Dynamic Island -->
    <rect id="phone_camera_notch" x="530" y="208" width="140" height="26" rx="13" fill="#0F172A" />
    <circle cx="555" cy="221" r="5" fill="#1E293B" />
    <circle cx="556" cy="220" r="1.5" fill="#3B82F6" opacity="0.8" />
    <circle cx="645" cy="221" r="3.5" fill="#1E293B" />

    <!-- Crabit Header UI (Brand Logo & Carats Pill) -->
    <g id="ui_header">
      <text id="brand_title" x="375" y="290" fill="#0F172A" font-size="30" font-weight="900" letter-spacing="1" font-family="system-ui, -apple-system, sans-serif">CRABIT</text>
      <!-- Carat Gem Pill Badge -->
      <g id="ui_header_carat_pill">
        <rect x="670" y="260" width="155" height="46" rx="23" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2" />
        <!-- Faceted Carat Diamond Icon -->
        <polygon id="carat_mini_gem" points="695,275 705,267 715,275 705,293" fill="#00E5FF" stroke="#0284C7" stroke-width="1.5" />
        <text x="725" y="291" fill="#1E3A8A" font-size="20" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">1,250</text>
      </g>
    </g>

    <!-- Hero Scholarship Card with Faceted Gemstone Theme -->
    <g id="ui_hero_wallet_card">
      <rect id="wallet_card_bg" x="370" y="335" width="460" height="240" rx="26" fill="url(#gem_blue_gradient)" />
      <text id="wallet_label" x="405" y="385" fill="#BFDBFE" font-size="20" font-weight="600" font-family="system-ui, -apple-system, sans-serif">나의 누적 캐럿 (Accumulated Carats)</text>

      <!-- Large Diamond Carat Token Emblem -->
      <g id="hero_carat_gemstone" transform="translate(695, 375)">
        <polygon points="60,10 90,35 75,85 45,85 30,35" fill="#38BDF8" />
        <polygon points="60,10 75,85 45,85" fill="#0284C7" opacity="0.6" />
        <polygon points="60,10 90,35 75,85" fill="#BAE6FD" opacity="0.8" />
        <circle cx="85" cy="20" r="4" fill="#FFFFFF" />
      </g>
      <text id="wallet_carat_value" x="405" y="455" fill="#FFFFFF" font-size="44" font-weight="900" font-family="system-ui, -apple-system, sans-serif">50,000 <tspan font-size="24" font-weight="600">Carats</tspan></text>
      <text id="wallet_krw_equiv" x="405" y="510" fill="#93C5FD" font-size="18" font-family="system-ui, -apple-system, sans-serif">≈ 50,000원 장학금 전환 가능</text>
    </g>

    <!-- Mission Completed Active Card (Triggers Interaction) -->
    <g id="ui_mission_card_active">
      <rect x="370" y="600" width="460" height="125" rx="22" fill="#FFFFFF" stroke="#E0E7FF" stroke-width="2" />
      <circle cx="430" cy="662" r="30" fill="#E0F2FE" />
      <polygon id="mission_reward_gem" points="430,644 444,656 436,676 424,676 416,656" fill="#0EA5E9" />
      <text x="480" y="652" fill="#0F172A" font-size="20" font-weight="700" font-family="system-ui, -apple-system, sans-serif">오늘의 학습 미션 완료!</text>
      <text x="480" y="685" fill="#0284C7" font-size="17" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">+ 500 Carats 즉시 지급</text>
    </g>

    <!-- Additional Study Streak Status Card -->
    <g id="ui_streak_card">
      <rect x="370" y="745" width="460" height="110" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="405" y="785" fill="#334155" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif">연속 학습 7일차 달성 🔥</text>
      <rect x="405" y="805" width="390" height="12" rx="6" fill="#E2E8F0" />
      <rect x="405" y="805" width="290" height="12" rx="6" fill="#10B981" />
      <text x="405" y="835" fill="#64748B" font-size="14" font-family="system-ui, -apple-system, sans-serif">내일 출석 시 +100 Carats 추가 보너스!</text>
    </g>

    <!-- Bottom Home Indicator Bar -->
    <rect id="phone_home_bar" x="520" y="1195" width="160" height="5" rx="2.5" fill="#CBD5E1" />
  </g>

  <!-- ======================================================================== -->
  <!-- 4. LEFT HAND WRIST & FRONT THUMB (SUPPORT / CRADLING HAND)               -->
  <!-- ======================================================================== -->
  <g id="left_hand_wrist_and_front_thumb">
    <!-- Solid Blue Sleeve Originating At (x=220, y=1600) -->
    <path id="left_sleeve" fill="#2563EB" d="M 120,1600 L 220,1280 L 370,1310 L 300,1600 Z" />

    <!-- Dark Ribbed Wrist Cuff (#1D4ED8) -->
    <rect id="left_wrist_cuff" x="195" y="1265" width="165" height="38" rx="10" fill="#1D4ED8" stroke="#1E40AF" stroke-width="2" transform="rotate(10 277 1284)" />

    <!-- Palm Support Mass Hugging Left-Bottom Chassis Edge -->
    <path id="left_palm_support" fill="#FFE3D1" stroke="#E2A888" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M 230,1270 C 260,1150 275,1030 290,920 C 295,860 305,820 325,780 L 350,780 C 342,880 325,1020 335,1290 Z" />

    <!-- Natural Anatomical Thumb Resting Against Front Left Bezel (x=310, y=780..880, Smooth Rounded Tip) -->
    <path id="left_thumb_natural" fill="#FFE3D1" stroke="#E2A888" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M 310,880 C 302,840 306,810 316,790 C 322,778 338,778 344,790 C 352,808 350,845 342,880 Z" />

    <!-- Thumb Knuckle Accent Line (#FDBA74) -->
    <path d="M 315,835 Q 328,830 342,835" stroke="#FDBA74" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Soft Thumbnail Catchlight -->
    <path d="M 322,792 C 326,784 334,784 338,792" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />
  </g>

  <!-- ======================================================================== -->
  <!-- 5. RIGHT HAND SLEEVE & CUFF (ORIGINATING AT x=980, y=1600)               -->
  <!-- ======================================================================== -->
  <g id="right_hand_sleeve_and_cuff">
    <!-- Solid Blue Sleeve (#2563EB) -->
    <path id="right_sleeve" fill="#2563EB" d="M 880,1600 L 760,1280 L 910,1235 L 1080,1600 Z" />

    <!-- Clean Ribbed Wrist Band (#1D4ED8) Ending at (x=820, y=1280) -->
    <rect id="right_wrist_cuff" x="745" y="1235" width="165" height="38" rx="10" fill="#1D4ED8" stroke="#1E40AF" stroke-width="2" transform="rotate(-18 827 1254)" />
  </g>

  <!-- ======================================================================== -->
  <!-- 6. RIGHT HAND SWIPING PALM & EXTENDED INDEX FINGER (TOUCH AT 640, 920)   -->
  <!-- ======================================================================== -->
  <g id="right_hand_swiping_palm_and_finger">
    <!-- Dorsal Palm Mass Tilting 40° Inward Towards Screen -->
    <path id="right_dorsal_palm" fill="#FFE3D1" stroke="#E2A888" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M 780,1240 C 750,1170 730,1100 705,1020 C 695,995 725,975 750,990 C 785,1015 820,1085 860,1220 Z" />

    <!-- Folded Supporting Digits (Curled Cleanly Into Palm Silhouette) -->
    <!-- Curled Middle Finger -->
    <path id="right_curled_middle" fill="#FFE3D1" stroke="#E2A888" stroke-width="3" stroke-linecap="round" d="M 715,1010 C 695,998 680,1018 692,1045 C 702,1062 728,1062 740,1040 Z" />
    <!-- Curled Ring Finger -->
    <path id="right_curled_ring" fill="#FFE3D1" stroke="#E2A888" stroke-width="3" stroke-linecap="round" d="M 740,1040 C 722,1028 710,1048 722,1072 C 732,1088 755,1088 765,1065 Z" />
    <!-- Curled Pinky Finger -->
    <path id="right_curled_pinky" fill="#FFE3D1" stroke="#E2A888" stroke-width="3" stroke-linecap="round" d="M 765,1065 C 752,1055 745,1072 755,1095 C 765,1108 782,1108 790,1090 Z" />

    <!-- Knuckle Creases (#FDBA74) -->
    <line x1="702" y1="1032" x2="720" y2="1032" stroke="#FDBA74" stroke-width="2" stroke-linecap="round" />
    <line x1="728" y1="1058" x2="746" y2="1058" stroke="#FDBA74" stroke-width="2" stroke-linecap="round" />

    <!-- Softly Tucked Thumb Beside Index Base -->
    <path id="right_thumb_tucked" fill="#FFE3D1" stroke="#E2A888" stroke-width="3" stroke-linecap="round" d="M 735,1085 C 710,1075 685,1095 700,1125 C 715,1145 750,1135 765,1110 Z" />
    <line x1="712" y1="1108" x2="732" y2="1115" stroke="#FDBA74" stroke-width="2" stroke-linecap="round" />

    <!-- EXTENDED INDEX FINGER (The Touch Finger - Touching Screen at x=640, y=920, Width=28px, rx=14) -->
    <!-- Smooth, Proportional Anatomical Finger (Palm-to-Finger Ratio 1:0.9) -->
    <path id="right_index_finger_shaft" fill="#FFE3D1" stroke="#E2A888" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M 715,1015 C 698,970 670,935 640,906 C 626,892 608,908 622,925 C 642,950 665,995 680,1045 Z" />

    <!-- Rounded Fingertip Pad (rx=14) Anchored Exactly at (x=640, y=920) -->
    <circle id="right_index_fingertip" cx="640" cy="920" r="14" fill="#FFE3D1" stroke="#E2A888" stroke-width="3" />

    <!-- Subtle Phalange Crease Lines (#FDBA74) -->
    <line x1="655" y1="965" x2="675" y2="978" stroke="#FDBA74" stroke-width="2.5" stroke-linecap="round" />
    <line x1="640" y1="935" x2="658" y2="948" stroke="#FDBA74" stroke-width="2.5" stroke-linecap="round" />

    <!-- Soft Catchlight on Fingertip -->
    <ellipse cx="640" cy="918" rx="6" ry="4" fill="#FFFFFF" opacity="0.75" />
  </g>

  <!-- ======================================================================== -->
  <!-- 7. TOUCH RIPPLE GLOW (LIVE INTERACTION EFFECT AT x=640, y=920)          -->
  <!-- ======================================================================== -->
  <g id="touch_ripple_glow">
    <!-- Soft Cyan Glow Behind Tap Point -->
    <circle cx="640" cy="920" r="60" fill="url(#touch_radial_glow)" />

    <!-- Soft Glowing Cyan Touch Ring (#00E5FF, Opacity 0.4) -->
    <circle id="touch_glow_ring" cx="640" cy="920" r="42" stroke="#00E5FF" stroke-width="3.5" fill="#00E5FF" fill-opacity="0.15" opacity="0.4" />

    <!-- Active Pulse Ring -->
    <circle id="touch_pulse_core" cx="640" cy="920" r="22" stroke="#00E5FF" stroke-width="2.5" stroke-dasharray="6 4" fill="none" opacity="0.8" />

    <!-- Center Contact Dot -->
    <circle cx="640" cy="920" r="6" fill="#00E5FF" />

    <!-- Micro Reward Carat Sparkle -->
    <polygon id="touch_mini_carat" points="605,890 613,883 621,890 613,904" fill="#00E5FF" stroke="#0284C7" stroke-width="1.2" />
    <path id="touch_sparkle_star" d="M 685,880 Q 685,890 675,890 Q 685,890 685,900 Q 685,890 695,890 Q 685,890 685,880 Z" fill="#F59E0B" />
  </g>
</svg>