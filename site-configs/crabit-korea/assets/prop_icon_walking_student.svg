<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Master Tokens & Swatches -->
    <linearGradient id="token_hoodie_blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <solidColor id="token_skin_base" solid-color="#FFE3D1" />
    <solidColor id="token_hair_slate" solid-color="#1E293B" />
    <solidColor id="token_pants_navy" solid-color="#334155" />
    <solidColor id="token_carat_cyan" solid-color="#00E5FF" />

    <filter id="soft_shadow_filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Energetic Walk Particles & Whims -->
  <g id="walking_sparkles_and_carats">
    <!-- Motion Whims (Joyful momentum behind student) -->
    <path id="motion_wind_top" d="M 180 480 Q 240 475 290 485" fill="none" stroke="#00E5FF" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
    <path id="motion_wind_mid" d="M 150 535 Q 225 530 275 540" fill="none" stroke="#FBBF24" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />
    <path id="motion_wind_low" d="M 190 590 Q 250 585 295 595" fill="none" stroke="#00E5FF" stroke-width="4.5" stroke-linecap="round" opacity="0.7" />

    <!-- Floating Cyan Carat Gem Particles (#00E5FF) and Daylight Yellow Sparkles (#FBBF24) -->
    <g id="carat_reward_front" transform="translate(735, 230)">
      <polygon points="20,0 40,15 32,38 8,38 0,15" fill="#00E5FF" stroke="#0891B2" stroke-width="1.8" stroke-linejoin="round" />
      <polygon points="20,0 40,15 28,18 20,5" fill="#67E8F9" opacity="0.9" />
      <polygon points="20,0 20,5 12,18 0,15" fill="#A5F3FC" opacity="0.9" />
      <path d="M 52 2 Q 52 18 36 18 Q 52 18 52 34 Q 52 18 68 18 Q 52 18 52 2 Z" fill="#FBBF24" />
      <circle cx="74" cy="32" r="3.5" fill="#00E5FF" />
    </g>

    <g id="carat_reward_top_left" transform="translate(310, 160)">
      <polygon points="16,0 32,12 26,30 6,30 0,12" fill="#00E5FF" stroke="#0891B2" stroke-width="1.5" stroke-linejoin="round" />
      <polygon points="16,0 32,12 22,14 16,4" fill="#67E8F9" opacity="0.9" />
      <path d="M -12 0 Q -12 12 -24 12 Q -12 12 -12 24 Q -12 12 0 12 Q -12 12 -12 0 Z" fill="#F59E0B" />
      <circle cx="38" cy="-5" r="3.5" fill="#FBBF24" />
    </g>

    <g id="carat_reward_ground" transform="translate(745, 840)">
      <polygon points="14,0 28,10 22,26 6,26 0,10" fill="#00E5FF" stroke="#0891B2" stroke-width="1.5" stroke-linejoin="round" />
      <path d="M 38 -5 Q 38 6 27 6 Q 38 6 38 17 Q 38 6 49 6 Q 38 6 38 -5 Z" fill="#FBBF24" />
      <circle cx="-10" cy="15" r="3.5" fill="#00E5FF" />
    </g>
  </g>

  <!-- Master Character Model Sheet Instantiation (3/4 Dynamic Right View) -->
  <!-- Scaled and positioned so baseline y=1400 aligns exactly with ground plane y=880 -->
  <g id="prop_walking_student_root" transform="translate(-11, -37) scale(0.655)">
<g id="turnaround_three_quarter_right">
      <!-- Ground Shadows -->
      <g id="tq_ground_shadows">
        <ellipse cx="640" cy="1400" rx="60" ry="12" fill="#000000" opacity="0.35" />
        <ellipse cx="910" cy="1400" rx="70" ry="14" fill="#000000" opacity="0.45" />
        <ellipse cx="770" cy="1402" rx="160" ry="18" fill="#000000" opacity="0.25" />
      </g>

      <!-- 1. Back Arm (Swinging Backwards) -->
      <g id="tq_back_arm">
        <path d="M 730 475 L 665 575 L 685 595 L 750 495 Z" fill="#1D4ED8" />
        <path d="M 665 575 L 625 655 L 650 670 L 685 595 Z" fill="#1D4ED8" />
        <rect x="615" y="645" width="30" height="15" rx="4" transform="rotate(32 630 652)" fill="#1E40AF" stroke="#1D4ED8" stroke-width="1.5" />
        <circle cx="620" cy="682" r="15" fill="#FFE3D1" stroke="#E2A888" stroke-width="1.5" />
        <ellipse cx="615" cy="688" rx="9" ry="6" fill="#F5CCA8" />
      </g>

      <!-- 2. Amber Backpack Subcomponent (#F59E0B) -->
      <g id="tq_backpack">
        <path d="M 700 460 C 700 425 665 425 665 460" fill="none" stroke="#D97706" stroke-width="8" stroke-linecap="round" />
        <path d="M 720 450 C 730 550 722 660 705 700 C 675 715 625 700 615 670 C 590 620 598 505 625 455 C 650 415 705 418 720 450 Z" fill="#F59E0B" stroke="#D97706" stroke-width="3.5" stroke-linejoin="round" />
        <path d="M 625 455 C 598 505 590 620 615 670 C 625 650 635 520 655 450 C 640 450 630 452 625 455 Z" fill="#D97706" opacity="0.6" />
        <rect x="600" y="530" width="40" height="70" rx="10" fill="#D97706" stroke="#B45309" stroke-width="2.5" />
        <line x1="605" y1="550" x2="635" y2="550" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" />
        <circle cx="615" cy="615" r="4" fill="#FBBF24" />
        <polygon points="615,620 622,628 619,638 611,638 608,628" fill="#00E5FF" stroke="#0891B2" stroke-width="1.2" />
      </g>

      <!-- 3. HIERARCHICAL ARTICULATED LEGS (PRESERVED 3-JOINT RIG) -->
      <!-- Back Leg: Pushing off behind, toe contacting ground plane (y=1400) -->
      <g id="tq_back_leg">
        <!-- Tier 1: Thigh -->
        <g id="tq_back_thigh" data-pivot="730 840">
          <path d="M 720 840 L 660 1072 L 705 1072 L 755 840 Z" fill="#243040" />
          <!-- Tier 2: Shin -->
          <g id="tq_back_shin" data-pivot="682 1072">
            <path d="M 660 1072 L 595 1345 L 648 1355 L 705 1072 Z" fill="#243040" />
            <path d="M 660 1072 Q 685 1090 705 1072" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />
            <!-- White Sock -->
            <polygon points="595,1340 648,1350 645,1365 592,1355" fill="#FFFFFF" />
            <!-- Tier 3: Foot (Sneaker Push-off) -->
            <g id="tq_back_foot" data-pivot="620 1355">
              <path d="M 590 1355 L 645 1362 L 670 1385 L 660 1400 L 610 1398 L 580 1375 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2.5" />
              <path d="M 595 1395 L 660 1400 L 658 1406 L 592 1402 Z" fill="#94A3B8" />
              <path d="M 605 1375 Q 632 1382 650 1380" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" />
              <line x1="615" y1="1362" x2="635" y2="1368" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
            </g>
          </g>
        </g>
      </g>

      <!-- Front Leg: Stepping forward, heel contacting ground plane (y=1400) -->
      <g id="tq_front_leg">
        <!-- Tier 1: Thigh -->
        <g id="tq_front_thigh" data-pivot="775 840">
          <path d="M 755 840 L 805 1072 L 855 1072 L 805 840 Z" fill="#334155" />
          <!-- Tier 2: Shin -->
          <g id="tq_front_shin" data-pivot="830 1072">
            <path d="M 805 1072 L 870 1340 L 925 1335 L 855 1072 Z" fill="#334155" />
            <path d="M 805 1072 Q 830 1090 855 1072" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />
            <!-- White Sock -->
            <polygon points="870,1340 925,1335 930,1355 875,1360" fill="#FFFFFF" />
            <!-- Tier 3: Foot (Sneaker Heel Contact) -->
            <g id="tq_front_foot" data-pivot="900 1345">
              <path d="M 872 1350 C 900 1342 930 1340 955 1362 L 995 1365 C 998 1375 992 1385 980 1388 L 890 1394 C 880 1394 870 1383 865 1370 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2.5" />
              <path d="M 868 1386 L 890 1394 L 985 1388 L 990 1396 L 892 1402 L 868 1396 Z" fill="#94A3B8" />
              <path d="M 900 1370 Q 930 1372 960 1365" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" />
              <line x1="915" y1="1352" x2="935" y2="1358" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
              <line x1="930" y1="1358" x2="950" y2="1365" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
            </g>
          </g>
        </g>
      </g>

      <!-- 4. Torso & Royal Blue Hoodie with Backpack Chest Harness -->
      <g id="tq_hoodie_torso">
        <path d="M 700 460 C 740 450 810 450 850 470 C 865 520 860 740 845 825 C 805 835 725 832 695 822 C 688 745 695 620 700 460 Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="3" stroke-linejoin="round" />
        <!-- Ribbed Hem (#1D4ED8) -->
        <path d="M 692 818 C 740 828 820 830 855 822 L 852 848 C 815 858 735 856 690 844 Z" fill="#1D4ED8" />
        <line x1="730" y1="822" x2="730" y2="850" stroke="#1E40AF" stroke-width="2.5" />
        <line x1="770" y1="825" x2="770" y2="854" stroke="#1E40AF" stroke-width="2.5" />
        <line x1="810" y1="824" x2="810" y2="852" stroke="#1E40AF" stroke-width="2.5" />

        <!-- Kangaroo Front Pocket -->
        <path d="M 725 700 C 765 692 820 695 845 710 C 840 760 835 788 828 805 C 792 810 740 808 712 800 C 708 780 716 735 725 700 Z" fill="#1D4ED8" opacity="0.95" />
        <path d="M 725 700 Q 738 735 728 775" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" />
        <path d="M 845 710 Q 832 742 828 785" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" />

        <!-- Front Shoulder Strap from Backpack (#F59E0B) -->
        <path d="M 765 450 C 780 520 790 620 795 725 L 775 725 C 770 620 760 520 748 450 Z" fill="#F59E0B" stroke="#D97706" stroke-width="2" />
        <!-- Chest Harness Horizontal Cross Strap crossing hoodie -->
        <rect x="740" y="565" width="85" height="12" rx="3" fill="#FDE68A" stroke="#D97706" stroke-width="2" />
        <rect x="770" y="560" width="18" height="22" rx="4" fill="#00E5FF" stroke="#0891B2" stroke-width="2" />

        <!-- White Hoodie Drawstrings (#FFFFFF) -->
        <path d="M 795 478 Q 792 525 794 560" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
        <circle cx="794" cy="564" r="4.5" fill="#FFFFFF" />
        <path d="M 818 478 Q 816 520 818 550" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
        <circle cx="818" cy="554" r="4.5" fill="#FFFFFF" />

        <!-- Cyan Carat Crest -->
        <polygon points="832,525 844,535 840,548 826,548 822,535" fill="#00E5FF" stroke="#38BDF8" stroke-width="1.8" />
      </g>

      <!-- 5. Front Arm (Swinging Forward with Hand) -->
      <g id="tq_front_arm">
        <path d="M 830 475 C 870 485 930 535 955 585 L 910 605 C 885 570 840 530 810 505 Z" fill="#2563EB" />
        <path d="M 915 580 L 1005 525 L 1025 555 L 935 610 Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="2" />
        <rect x="995" y="520" width="35" height="18" rx="6" transform="rotate(-30 1012 529)" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1.5" />
        <circle cx="1035" cy="520" r="16" fill="#FFE3D1" stroke="#E2A888" stroke-width="1.5" />
        <ellipse cx="1042" cy="524" rx="9" ry="6" fill="#F5CCA8" />
      </g>

      <!-- 6. Head & Expression (3/4 Right Canonical Hero DNA) -->
      <g id="tq_head_assembly">
        <!-- Neck Column: #FFE3D1, 22px high -->
        <rect x="760" y="388" width="36" height="32" fill="#FFE3D1" />
        <path d="M 760 388 C 772 398 784 398 796 388 L 796 398 C 784 408 772 408 760 398 Z" fill="#E2A888" opacity="0.4" />

        <!-- Hoodie Collar -->
        <path d="M 740 425 C 775 440 810 440 840 425 C 830 450 760 450 740 425 Z" fill="#1D4ED8" />

        <!-- Head Base: cx=770, cy=300, r=90 -->
        <circle id="tq_head_base" cx="770" cy="300" r="90" fill="#FFE3D1" />

        <!-- Right Ear -->
        <circle cx="860" cy="300" r="14" fill="#FFE3D1" />
        <path d="M 860 295 Q 855 300 860 305" fill="none" stroke="#E2A888" stroke-width="2" stroke-linecap="round" />

        <!-- Hair: Side-swept slate #1E293B framing forehead -->
        <path d="M 678 300 C 672 190 715 180 770 180 C 825 180 868 190 862 300 C 858 270 842 240 822 235 C 795 240 770 265 738 270 C 708 272 692 255 678 300 Z" fill="#1E293B" />

        <!-- Cheeks: Rosy Blush (#FCA5A5, 0.6 op) -->
        <circle cx="728" cy="315" r="14" fill="#FCA5A5" opacity="0.6" />
        <circle cx="828" cy="315" r="14" fill="#FCA5A5" opacity="0.6" />

        <!-- Arched Brows (#1E293B) -->
        <path d="M 720 270 Q 738 258 755 266" fill="none" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round" />
        <path d="M 798 266 Q 815 258 832 270" fill="none" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round" />

        <!-- Sparkling Star-Glint Eyes (#0F172A) -->
        <g id="tq_eye_left">
          <circle cx="740" cy="288" r="9.5" fill="#0F172A" />
          <circle cx="737" cy="284" r="3" fill="#FFFFFF" />
          <circle cx="743" cy="290" r="1.5" fill="#FFFFFF" />
        </g>
        <g id="tq_eye_right">
          <circle cx="815" cy="288" r="9.5" fill="#0F172A" />
          <circle cx="812" cy="284" r="3" fill="#FFFFFF" />
          <circle cx="818" cy="290" r="1.5" fill="#FFFFFF" />
        </g>

        <!-- Nose (#E2A888) -->
        <path d="M 780 292 L 780 302 L 786 303" fill="none" stroke="#E2A888" stroke-width="2.8" stroke-linecap="round" />

        <!-- Smile with Teeth & Tongue -->
        <g id="tq_smile">
          <path d="M 750 318 Q 778 350 806 318 Z" fill="#EF4444" />
          <path d="M 755 319 Q 778 328 801 319 Q 778 322 755 319 Z" fill="#FFFFFF" />
          <path d="M 766 338 Q 778 330 790 338 C 786 348 770 348 766 338 Z" fill="#F87171" />
          <path d="M 748 317 Q 778 352 808 317" fill="none" stroke="#B91C1C" stroke-width="2.2" stroke-linecap="round" />
        </g>
      </g>
    </g>
  </g>
</svg>
