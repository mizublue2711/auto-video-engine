<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" id="svg_crabit_card_carats_deposit" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Premium Deep Blue Hologram Gradient -->
    <linearGradient id="card_hologram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="gem_cyan_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="drop_shadow_ticker" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- 1. Card Base Plate -->
  <g id="card_plate_group">
     <rect id="card_shadow" x="180" y="180" width="640" height="400" rx="36" fill="#090D16" opacity="0.3" />
     <rect id="card_surface" x="180" y="160" width="640" height="400" rx="36" fill="url(#card_hologram)" stroke="#60A5FA" stroke-width="2" />
     <path id="card_geometric_facets" opacity="0.12" fill="#FFFFFF" d="M180,160 L450,160 L320,560 L180,560 Z" />
  </g>

  <!-- 2. Metallic EMV Chip (Receiver) -->
  <g id="card_chip" transform="translate(250, 260)">
     <rect width="70" height="54" rx="8" fill="#FBBF24" stroke="#D97706" stroke-width="1.5" />
     <path d="M0,27 h70 M25,0 v54 M45,0 v54" stroke="#B45309" stroke-width="1.5" />
  </g>

  <!-- 3. Crabit Card Typography & Co-branding -->
  <g id="card_text_group">
     <text x="250" y="470" fill="#FFFFFF" font-size="32" font-weight="900" letter-spacing="3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">CRABIT</text>
     <text x="250" y="505" fill="#93C5FD" font-size="16" font-weight="600" letter-spacing="1" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">STUDENT SCHOLARSHIP CARD</text>
     <!-- Brand Logo Mark: Mini Diamond inside Crab Crest -->
     <polygon points="730,220 750,205 770,220 750,250" fill="url(#gem_cyan_grad)" />
  </g>

  <!-- 4. Carat Gems Stream (Particle Flow toward Card Chip) -->
  <g id="carat_gems_stream">
     <!-- Gem 1 (Leading into the chip) -->
     <g id="carat_gem_1" transform="translate(360, 240)">
        <polygon points="30,5 50,22 40,55 20,55 10,22" fill="url(#gem_cyan_grad)" stroke="#E0F2FE" stroke-width="2" />
        <circle cx="45" cy="15" r="3" fill="#FFFFFF" />
     </g>
     <!-- Gem 2 (Mid-flight) -->
     <g id="carat_gem_2" transform="translate(480, 160)">
        <polygon points="25,4 42,18 34,45 17,45 8,18" fill="url(#gem_cyan_grad)" stroke="#E0F2FE" stroke-width="1.5" />
     </g>
     <!-- Gem 3 (Floating in from top right) -->
     <g id="carat_gem_3" transform="translate(620, 110)">
        <polygon points="20,3 34,14 27,36 13,36 6,14" fill="url(#gem_cyan_grad)" opacity="0.8" />
     </g>
  </g>

  <!-- 5. Floating Balance Ticker (Pop-up Result) -->
  <g id="card_balance_ticker" transform="translate(320, 600)">
     <rect width="360" height="84" rx="42" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3" filter="url(#drop_shadow_ticker)" />
     <!-- Green check badge -->
     <circle cx="50" cy="42" r="24" fill="#10B981" />
     <path d="M40,42 L47,49 L60,35" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
     <!-- Balance text -->
     <text x="95" y="40" fill="#64748B" font-size="14" font-weight="600" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">장학금 충전 완료 (Recharged)</text>
     <text x="95" y="66" fill="#0F172A" font-size="24" font-weight="900" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">+ 50,000 KRW</text>
  </g>
</svg>
