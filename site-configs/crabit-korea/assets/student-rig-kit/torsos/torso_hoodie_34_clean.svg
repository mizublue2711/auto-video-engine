<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" width="360" height="420">
  <!-- Universal Bare Student Torso (3/4 View Clean Hoodie) -->
  <g id="torso_hoodie_34_clean" data-pivot="175 380">
    <!-- 1. Hoodie Collar Assembly -->
    <!-- Back Interior Rim Behind Neck Socket (180, 42) -->
    <path id="hoodie_collar_back" d="M 148 48 Q 180 30 212 44" fill="none" stroke="#1D4ED8" stroke-width="14" stroke-linecap="round" />
    <ellipse id="hoodie_collar_interior" cx="180" cy="40" rx="26" ry="8" fill="#0F172A" opacity="0.75" />

    <!-- 2. Main Hoodie Torso Body (#2563EB) -->
    <!-- Natural teen hoodie silhouette: angled 6° forward, athletic shoulders, tapered waist -->
    <path id="hoodie_torso_base" d="M 148 48 C 132 54 102 74 88 95 C 84 105 86 125 88 152 C 92 210 96 280 114 358 L 236 358 C 265 295 288 205 284 162 C 280 122 272 100 255 95 L 212 44 C 192 56 168 56 148 48 Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Left Lateral Back Shade (#1D4ED8) -->
    <path id="hoodie_back_shade" d="M 148 48 C 132 54 102 74 88 95 C 84 105 86 125 88 152 C 92 210 96 280 114 358 L 136 358 C 122 245 116 145 148 48 Z" fill="#1D4ED8" opacity="0.35" />

    <!-- Front Collar Rim Over Clavicle -->
    <path id="hoodie_collar_front" d="M 148 48 Q 180 72 212 44 C 206 66 194 78 180 78 C 166 78 154 66 148 48 Z" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1.8" />

    <!-- 3. Subtle Chest Creases & Forward Momentum Folds -->
    <path id="chest_fold_upper" d="M 158 176 Q 185 188 218 182" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path id="chest_fold_lower" d="M 168 212 Q 196 222 228 216" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <path id="belly_fold_accent" d="M 154 245 Q 172 254 195 250" fill="none" stroke="#1D4ED8" stroke-width="1.8" stroke-linecap="round" opacity="0.4" />

    <!-- 4. Kangaroo Front Pocket (#1D4ED8) -->
    <path id="hoodie_kangaroo_pocket" d="M 142 272 C 180 262 226 266 248 282 C 242 314 236 342 228 358 L 136 358 C 132 338 136 300 142 272 Z" fill="#1D4ED8" stroke="#1E40AF" stroke-width="2" />
    <!-- Pocket Entry Slits -->
    <path id="pocket_slit_left" d="M 142 272 Q 152 302 145 334" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" />
    <path id="pocket_slit_right" d="M 248 282 Q 240 312 234 342" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" />

    <!-- 5. Dark Navy Ribbed Bottom Hem (#1D4ED8) terminating around y=380 -->
    <path id="hoodie_waist_cuff" d="M 112 358 L 238 358 C 239 368 235 378 228 380 L 118 380 C 111 376 110 368 112 358 Z" fill="#1D4ED8" stroke="#1E40AF" stroke-width="2" />
    <!-- Ribbing Seam Lines -->
    <line x1="128" y1="360" x2="128" y2="378" stroke="#1E40AF" stroke-width="1.5" stroke-linecap="round" />
    <line x1="144" y1="360" x2="144" y2="378" stroke="#1E40AF" stroke-width="1.5" stroke-linecap="round" />
    <line x1="160" y1="360" x2="160" y2="378" stroke="#1E40AF" stroke-width="1.5" stroke-linecap="round" />
    <line x1="175" y1="360" x2="175" y2="378" stroke="#1E40AF" stroke-width="1.5" stroke-linecap="round" />
    <line x1="190" y1="360" x2="190" y2="378" stroke="#1E40AF" stroke-width="1.5" stroke-linecap="round" />
    <line x1="206" y1="360" x2="206" y2="378" stroke="#1E40AF" stroke-width="1.5" stroke-linecap="round" />
    <line x1="222" y1="360" x2="222" y2="378" stroke="#1E40AF" stroke-width="1.5" stroke-linecap="round" />

    <!-- 6. Clean White Hoodie Drawstrings (#FFFFFF) Hanging Naturally -->
    <g id="hoodie_drawstrings">
      <!-- Left Drawstring -->
      <path id="drawstring_left" d="M 166 68 Q 162 110 166 150" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
      <circle id="drawstring_left_tip" cx="166" cy="154" r="4.2" fill="#FFFFFF" />
      <!-- Right Drawstring -->
      <path id="drawstring_right" d="M 194 68 Q 198 105 196 142" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
      <circle id="drawstring_right_tip" cx="196" cy="146" r="4.2" fill="#FFFFFF" />
    </g>

    <!-- 7. Cyan Carat Crest (#00E5FF) on Upper Right Chest -->
    <g id="carat_crest" transform="translate(248, 136)">
      <polygon id="carat_crest_outer" points="0,-11 10,-3 7,9 -7,9 -10,-3" fill="#00E5FF" stroke="#38BDF8" stroke-width="1.4" stroke-linejoin="round" />
      <polygon id="carat_crest_facet" points="0,-11 10,-3 0,0 -10,-3" fill="#BAE6FD" opacity="0.85" />
    </g>

    <!-- 8. Semantic Sockets (Metadata snap anchors) -->
    <!-- Neck Socket: (180, 42) -->
    <circle id="socket_neck" cx="180" cy="42" r="2.5" fill="none" opacity="0" />
    <!-- Hip Socket: (175, 380) -->
    <circle id="socket_hip" cx="175" cy="380" r="2.5" fill="none" opacity="0" />
    <!-- Left Shoulder Socket: (90, 95) -->
    <circle id="socket_shoulder_l" cx="90" cy="95" r="2.5" fill="none" opacity="0" />
    <!-- Right Shoulder Socket: (255, 95) -->
    <circle id="socket_shoulder_r" cx="255" cy="95" r="2.5" fill="none" opacity="0" />
  </g>
</svg>
