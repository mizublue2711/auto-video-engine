<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="300" height="320">
  <!-- KOREAN ANIME RIG: Right Hand First-Person POV Swiping / Tapping -->
  <!-- Pure warm skin: #FFE3D1 | Contour: #E0A890 (2.5px) | Accents: #FCA5A5 (0.6 opacity) | Cuff: #2563EB / #1D4ED8 -->

  <!-- ========================================================================= -->
  <!-- MAIN RIG GROUP: First Person POV Hand                                     -->
  <!-- ========================================================================= -->
  <g id="hand_swiping_pov" data-socket-wrist="250 280" data-socket-touch="105 65">

    <!-- Wrist Base Extension (fills under sleeve cuff without peeking corners) -->
    <path d="M 230 270 L 275 292 L 285 315 L 235 315 Z"
          fill="#FFE3D1" />

    <!-- MASTER UNIFIED DORSAL HAND & HERO INDEX FINGER (Zero Seams, Zero Steps) -->
    <!-- Continuous organic anime silhouette: wrist -> dorsal hand -> index finger -> web -> rounded thumb -> wrist -->
    <path d="M 270 290
             C 260 242, 246 206, 226 186
             C 214 176, 196 168, 175 164
             C 165 162, 155 142, 142 120
             C 130 98, 118 78, 110 66
             C 106 60, 98 62, 96 68
             C 94 74, 102 88, 112 110
             C 122 134, 132 158, 138 174
             C 134 186, 122 196, 124 208
             C 126 218, 138 226, 154 234
             C 174 245, 202 265, 225 278 Z"
          fill="#FFE3D1" stroke="#E0A890" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Soft Knuckle Silhouettes across MCP joints (#FCA5A5, opacity 0.6) -->
    <path d="M 174 168 C 178 164, 184 166, 187 170"
          fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M 196 176 C 200 172, 205 174, 207 178"
          fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M 216 185 C 219 182, 223 183, 225 187"
          fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Hero Index Finger Details (Exactly two subtle knuckle ticks) -->
    <!-- PIP joint tick -->
    <path d="M 126 112 C 131 108, 137 110, 140 114"
          fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <!-- DIP joint tick -->
    <path d="M 114 82 C 118 78, 123 80, 125 84"
          fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Clean Oval Fingernail Reflection on Hero Pointer -->
    <path d="M 104 68 C 107 64, 112 66, 114 70 C 113 74, 108 75, 104 71 Z"
          fill="#FFFFFF" opacity="0.35" />

    <!-- Folded Thumb Accents (Naturally rounded along lower left edge) -->
    <path d="M 130 206 C 135 210, 140 208, 143 204"
          fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M 128 198 C 131 195, 135 196, 136 199 C 135 202, 131 203, 128 200 Z"
          fill="#FFFFFF" opacity="0.35" />

    <!-- Student Royal Blue Sleeve Cuff entering diagonally from bottom-right (x: 210..290, y: 250..315) -->
    <g id="sleeve_cuff_pov">
      <!-- Main sleeve fabric -->
      <path d="M 300 268 L 246 288 C 236 292, 226 304, 230 316 L 235 325 L 300 325 Z"
            fill="#2563EB" stroke="#1D4ED8" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Ribbed cuff hem band -->
      <path d="M 246 288 C 238 292, 230 302, 234 316 L 244 320 C 240 308, 246 300, 256 296 Z"
            fill="#1D4ED8" stroke="#1D4ED8" stroke-width="1.5" stroke-linejoin="round" />
      <!-- Sleeve wrinkle crease -->
      <path d="M 265 292 C 275 302, 286 308, 298 310"
            fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" />
    </g>

  </g>
</svg>