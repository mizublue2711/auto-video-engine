<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="300" height="320">
  <!-- STUDENT RIG KIT: Right Hand First-Person POV Swiping / Tapping (True Anime Foreshortened Rig) -->
  <!-- Base Skin: #FFE3D1 | Contour: #E0A890 | Accents: #FCA5A5 | Sleeve: #2563EB / #1D4ED8 -->

  <defs>
    <!-- Soft depth gradient for dorsal palm in perspective -->
    <linearGradient id="povPalmGrad" x1="100%" y1="100%" x2="25%" y2="15%">
      <stop offset="0%" stop-color="#F5C7AF" />
      <stop offset="50%" stop-color="#FFE3D1" />
      <stop offset="100%" stop-color="#FFF0E5" />
    </linearGradient>

    <!-- Depth shadow gradient for flexed fingers -->
    <linearGradient id="flexedFingersGrad" x1="80%" y1="100%" x2="20%" y2="0%">
      <stop offset="0%" stop-color="#EDB89D" />
      <stop offset="100%" stop-color="#F5C7AF" />
    </linearGradient>
  </defs>

  <!-- ========================================================================= -->
  <!-- MAIN RIG GROUP: First Person POV Hand                                     -->
  <!-- ========================================================================= -->
  <g id="hand_swiping_pov" data-socket-wrist="230 310" data-socket-touch="100 70">

    <!-- Wrist & Forearm Skin (emerges from cuff opening) -->
    <path d="M 210 270 C 220 252, 230 240, 245 235 L 275 285 C 265 292, 250 302, 240 312 Z"
          fill="#FFE3D1" stroke="#E0A890" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Curled / Flexed fingers in perspective depth behind knuckles -->
    <g id="pov_flexed_fingers">
      <!-- Pinky folded into palm depth -->
      <path d="M 206 172 C 222 172, 234 180, 232 192 C 230 202, 218 208, 204 206 C 196 204, 192 196, 194 186 Z"
            fill="url(#flexedFingersGrad)" stroke="#E0A890" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
      <!-- Ring folded into palm depth -->
      <path d="M 184 158 C 200 158, 214 166, 212 178 C 210 188, 196 194, 182 192 C 172 190, 168 180, 170 170 Z"
            fill="url(#flexedFingersGrad)" stroke="#E0A890" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
      <!-- Middle finger folded into depth below index -->
      <path d="M 160 144 C 178 144, 194 152, 192 166 C 190 178, 174 184, 158 180 C 148 176, 144 165, 146 154 Z"
            fill="url(#flexedFingersGrad)" stroke="#E0A890" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
      <!-- Middle finger fold crease -->
      <path d="M 170 156 C 176 158, 178 165, 174 171"
            fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- MASTER UNIFIED DORSAL HAND, THUMB & PROPORTIONAL HERO INDEX FINGER -->
    <!-- Broad solid dorsal mass with foreshortened index finger reaching touch point (100, 70) -->
    <g id="pov_unified_dorsal_mass">
      <!-- Continuous anatomical silhouette: wrist, thenar eminence, thumb, index finger, and ulnar return -->
      <path d="M 210 270
               C 180 248, 150 226, 132 208
               C 118 194, 122 182, 135 180
               C 146 178, 156 188, 160 196
               C 148 174, 138 155, 132 140
               C 122 118, 110 94, 102 78
               C 96 66, 88 64, 94 60
               C 100 56, 112 58, 120 68
               C 132 80, 145 106, 155 130
               C 165 146, 172 154, 180 158
               C 194 162, 212 170, 226 182
               C 238 194, 252 222, 256 238
               C 260 254, 264 270, 270 286 Z"
            fill="url(#povPalmGrad)" stroke="#E0A890" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />

      <!-- Thumb joint crease -->
      <path d="M 136 195 C 141 197, 145 196, 148 192"
            fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" />
      <!-- Thumb nail accent -->
      <path d="M 130 186 C 133 183, 137 184, 139 187"
            fill="none" stroke="#E0A890" stroke-width="1.5" stroke-linecap="round" />

      <!-- 4-Knuckle MCP Ridge Line (Soft anime anatomical accents) -->
      <!-- Index MCP knuckle -->
      <path d="M 146 142 C 152 136, 160 137, 164 142"
            fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" />
      <!-- Middle MCP knuckle -->
      <path d="M 172 148 C 178 142, 184 143, 187 149"
            fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" />
      <!-- Ring MCP knuckle -->
      <path d="M 192 156 C 196 151, 202 152, 204 157"
            fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" />
      <!-- Pinky MCP knuckle -->
      <path d="M 208 165 C 211 161, 216 162, 218 167"
            fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" />

      <!-- Extensor tendon subtle highlight -->
      <path d="M 154 140 C 168 180, 192 222, 218 255"
            fill="none" stroke="#F5C7AF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

      <!-- Index finger PIP joint crease (#FCA5A5) -->
      <path d="M 134 108 C 140 104, 148 106, 152 112"
            fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" />

      <!-- Index finger DIP joint crease (#FCA5A5) -->
      <path d="M 118 78 C 124 74, 130 76, 134 82"
            fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" />

      <!-- Dorsal Nail Bed accent on distal phalanx -->
      <path d="M 102 66 C 105 62, 111 63, 114 68 C 112 72, 106 72, 102 66 Z"
            fill="#F5C7AF" stroke="#E0A890" stroke-width="1.5" stroke-linejoin="round" />

      <!-- Fingertip contact pad highlight (soft light reflection) -->
      <path d="M 98 64 C 102 60, 108 61, 110 65"
            fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
    </g>

    <!-- Student Hoodie Sleeve Cuff (drawn over wrist base for seamless integration) -->
    <g id="cuff_sleeve_group">
      <!-- Sleeve forearm body -->
      <path d="M 300 268 L 246 288 C 236 292, 226 304, 230 316 L 235 325 L 300 325 Z"
            fill="#2563EB" stroke="#1D4ED8" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Ribbed cuff hem band -->
      <path d="M 246 288 C 238 292, 230 302, 234 316 L 244 320 C 240 308, 246 300, 256 296 Z"
            fill="#1D4ED8" stroke="#1D4ED8" stroke-width="1.5" stroke-linejoin="round" />
      <!-- Sleeve diagonal fold crease -->
      <path d="M 265 292 C 275 302, 286 308, 298 310"
            fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" />
    </g>

  </g>
</svg>