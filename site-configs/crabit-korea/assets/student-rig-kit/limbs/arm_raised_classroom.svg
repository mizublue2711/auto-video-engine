<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 400" width="240" height="400">
  <!-- Student Raised Arm Classroom Gesture Rig Component (Scene 3B) -->
  <g id="arm_raised_classroom" data-pivot="40 360">
    <!-- 1. Welded Anatomical Shoulder Joint Foundation at (40, 360) -->
    <circle id="shoulder_socket_joint" cx="40" cy="360" r="22" fill="#2563EB" />

    <!-- 2. Royal Blue Hoodie Sleeve (#2563EB) Ascending at ~75° Angle -->
    <!-- Seamlessly welds to shoulder socket at (40, 360) and tapers to wrist cuff (122, 136) -->
    <path id="arm_sleeve_body" d="M 22 368 C 26 295 62 205 104 144 L 140 128 C 114 205 94 298 62 364 C 52 376 30 378 22 368 Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Sleeve Inner Shadow & Tension Folds (#1D4ED8) -->
    <path id="sleeve_shade" d="M 22 368 C 26 295 62 205 104 144 L 116 139 C 84 210 56 300 44 366 Z" fill="#1D4ED8" opacity="0.35" />
    <path id="elbow_crease" d="M 74 238 Q 86 246 98 242" fill="none" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round" />

    <!-- 3. Dark Navy Ribbed Wrist Cuff (#1D4ED8) Angled Perpendicular to Sleeve -->
    <g id="wrist_cuff_group" transform="translate(122, 136) rotate(-22)">
      <rect id="wrist_cuff_base" x="-20" y="-8" width="40" height="16" rx="4" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1.8" />
      <!-- Ribbing Stitch Texture Lines -->
      <line x1="-12" y1="-6" x2="-12" y2="6" stroke="#1E40AF" stroke-width="1.4" stroke-linecap="round" />
      <line x1="-4" y1="-6" x2="-4" y2="6" stroke="#1E40AF" stroke-width="1.4" stroke-linecap="round" />
      <line x1="4" y1="-6" x2="4" y2="6" stroke="#1E40AF" stroke-width="1.4" stroke-linecap="round" />
      <line x1="12" y1="-6" x2="12" y2="6" stroke="#1E40AF" stroke-width="1.4" stroke-linecap="round" />
    </g>

    <!-- 4. Unified Anatomical Open Hand (#FFE3D1) Raised High with Reaching Fingers -->
    <g id="hand_raised_group">
      <!-- Master Organic Hand Contour: Seamless integration of wrist, palm, thumb, and 4 fingers -->
      <path id="hand_master_mesh" d="
        M 112 128
        C 106 118 100 108 96 98
        C 90 94 78 88 74 82
        C 70 76 76 72 82 74
        C 88 76 96 82 98 84
        C 98 70 100 46 102 34
        C 103 26 113 26 114 34
        C 115 48 116 62 116 68
        C 117 55 120 32 121 22
        C 122 14 132 14 133 22
        C 134 40 134 60 134 70
        C 136 58 140 42 142 32
        C 143 24 153 25 153 33
        C 152 48 150 64 149 76
        C 151 66 156 56 160 50
        C 163 45 172 48 170 56
        C 166 70 158 92 152 108
        C 146 120 138 122 132 122
        Z"
        fill="#FFE3D1" stroke="#E2A888" stroke-width="2" stroke-linejoin="round" />

      <!-- Finger Separation Inset Creases (Web Clefts) -->
      <path id="cleft_index_middle" d="M 116 68 L 115 80" fill="none" stroke="#E2A888" stroke-width="1.6" stroke-linecap="round" />
      <path id="cleft_middle_ring" d="M 134 70 L 133 82" fill="none" stroke="#E2A888" stroke-width="1.6" stroke-linecap="round" />
      <path id="cleft_ring_pinky" d="M 149 76 L 147 88" fill="none" stroke="#E2A888" stroke-width="1.6" stroke-linecap="round" />
      <path id="cleft_thumb_palm" d="M 96 84 C 98 90 102 96 106 102" fill="none" stroke="#FDBA74" stroke-width="1.8" stroke-linecap="round" />

      <!-- Interphalangeal Joint Creases (#FDBA74) -->
      <!-- Index Creases -->
      <line x1="103" y1="48" x2="111" y2="49" stroke="#FDBA74" stroke-width="1.4" stroke-linecap="round" />
      <line x1="104" y1="60" x2="113" y2="61" stroke="#FDBA74" stroke-width="1.4" stroke-linecap="round" />
      <!-- Middle Creases -->
      <line x1="122" y1="38" x2="131" y2="39" stroke="#FDBA74" stroke-width="1.4" stroke-linecap="round" />
      <line x1="123" y1="52" x2="132" y2="53" stroke="#FDBA74" stroke-width="1.4" stroke-linecap="round" />
      <!-- Ring Creases -->
      <line x1="142" y1="46" x2="150" y2="47" stroke="#FDBA74" stroke-width="1.4" stroke-linecap="round" />
      <line x1="141" y1="58" x2="149" y2="59" stroke="#FDBA74" stroke-width="1.4" stroke-linecap="round" />
      <!-- Pinky Crease -->
      <line x1="158" y1="65" x2="166" y2="68" stroke="#FDBA74" stroke-width="1.4" stroke-linecap="round" />

      <!-- Palm Lifelines & Thenar Creases (#FDBA74) -->
      <path id="palm_lifeline_major" d="M 106 100 Q 120 95 138 98" fill="none" stroke="#FDBA74" stroke-width="1.8" stroke-linecap="round" />
      <path id="palm_lifeline_minor" d="M 112 110 Q 124 106 134 112" fill="none" stroke="#FDBA74" stroke-width="1.5" stroke-linecap="round" />

      <!-- Soft Catchlight Highlights on Fingertips (#FFFFFF) -->
      <line x1="106" y1="32" x2="106" y2="44" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
      <line x1="125" y1="22" x2="125" y2="36" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
      <line x1="146" y1="30" x2="146" y2="44" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
      <line x1="164" y1="52" x2="162" y2="62" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    </g>

    <!-- 5. Anatomical Shoulder Pivot Snap Anchor -->
    <circle id="socket_shoulder" cx="40" cy="360" r="3" fill="none" opacity="0" />
  </g>
</svg>
