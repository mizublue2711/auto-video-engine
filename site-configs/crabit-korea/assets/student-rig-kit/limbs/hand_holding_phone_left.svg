<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280">
  <!-- KOREAN ANIME RIG: Left Hand Holding Phone (Clean Decoupled Sandwich) -->
  <!-- Pure warm skin: #FFE3D1 | Contour: #E0A890 (2.5px) | Accents: #FCA5A5 (0.6 opacity) | Cuff: #2563EB / #1D4ED8 -->

  <!-- ========================================================================= -->
  <!-- LAYER 1: REAR FINGERS, PALM BASE & HOODIE CUFF (Rendered BEHIND Phone)    -->
  <!-- ========================================================================= -->
  <g id="hand_left_rear_fingers" data-socket-wrist="70 250" data-socket-phone="120 140">

    <!-- Wrist base extension under cuff -->
    <path d="M 46 232 L 95 242 L 85 275 L 36 265 Z"
          fill="#FFE3D1" />

    <!-- MASTER UNIFIED REAR PALM & 4 CRADLING FINGERS (Zero Rake, Organic Human Contours) -->
    <!-- Encompasses palm support plate and 4 softly curled fingers on right side: x: 145..190, y: 75..215 -->
    <path d="M 50 232
             C 66 195, 96 145, 138 95
             C 152 82, 170 78, 180 84
             C 186 89, 185 96, 178 102
             C 168 108, 158 108, 150 112
             C 166 114, 180 116, 186 122
             C 192 128, 190 136, 182 140
             C 172 144, 162 144, 152 148
             C 164 150, 176 152, 182 158
             C 188 164, 186 172, 178 176
             C 168 180, 158 180, 148 184
             C 158 186, 170 190, 174 196
             C 178 202, 174 210, 166 212
             C 154 214, 138 218, 122 226
             C 104 235, 82 242, 64 240 Z"
          fill="#FFE3D1" stroke="#E0A890" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Minimal clean interdigital fold lines between fingers -->
    <path d="M 150 112 C 142 116, 134 122, 128 132"
          fill="none" stroke="#E0A890" stroke-width="2" stroke-linecap="round" />
    <path d="M 152 148 C 144 152, 136 158, 130 168"
          fill="none" stroke="#E0A890" stroke-width="2" stroke-linecap="round" />
    <path d="M 148 184 C 140 188, 132 194, 126 204"
          fill="none" stroke="#E0A890" stroke-width="2" stroke-linecap="round" />

    <!-- Exactly one subtle knuckle accent tick per finger (#FCA5A5, opacity 0.6) -->
    <!-- Index finger tick -->
    <path d="M 170 88 C 174 92, 172 97, 168 100"
          fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <!-- Middle finger tick -->
    <path d="M 176 124 C 180 128, 178 134, 173 138"
          fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <!-- Ring finger tick -->
    <path d="M 172 160 C 176 164, 174 170, 169 174"
          fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <!-- Pinky finger tick -->
    <path d="M 164 198 C 168 202, 166 207, 162 210"
          fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Clean subtle fingernail reflection hints on wrapped pads -->
    <path d="M 176 86 C 180 86, 182 89, 180 93"
          fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
    <path d="M 182 124 C 186 125, 188 128, 186 132"
          fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
    <path d="M 178 160 C 182 161, 184 164, 182 168"
          fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
    <path d="M 170 198 C 173 199, 175 202, 173 206"
          fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />

    <!-- Student Royal Blue Sleeve Cuff entering bottom-left (x: 40..100, y: 220..275) -->
    <g id="sleeve_cuff_left">
      <!-- Main sleeve fabric -->
      <path d="M 16 280 L 42 232 C 46 224, 56 220, 68 224 L 98 236 C 108 240, 112 250, 108 260 L 96 280 Z"
            fill="#2563EB" stroke="#1D4ED8" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Dark navy ribbed hem trim -->
      <path d="M 42 232 C 52 220, 78 217, 98 236 L 102 244 C 82 226, 56 230, 47 242 Z"
            fill="#1D4ED8" stroke="#1D4ED8" stroke-width="1.5" stroke-linejoin="round" />
      <!-- Subtle fabric crease -->
      <path d="M 48 256 C 60 250, 76 254, 86 266"
            fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" />
    </g>

  </g>

  <!-- ========================================================================= -->
  <!-- LAYER 2: FRONT THUMB & THENAR PAD (Rendered IN FRONT of Phone)            -->
  <!-- ========================================================================= -->
  <g id="hand_left_front_thumb" data-socket-wrist="70 250" data-socket-phone="120 140">
    <!-- Organic curved thumb pad extending at a 40° angle from palm heel (x: 50..95, y: 110..165) -->
    <!-- Soft arc with radius > 16px, resting naturally on left bezel -->
    <path d="M 48 232
             C 42 205, 46 172, 54 150
             C 60 134, 70 120, 84 116
             C 94 114, 100 122, 98 132
             C 96 142, 88 152, 82 165
             C 74 182, 70 206, 68 232 Z"
          fill="#FFE3D1" stroke="#E0A890" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Exactly one subtle knuckle crease accent (#FCA5A5, opacity 0.6) -->
    <path d="M 72 136 C 77 141, 83 140, 87 136"
          fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Clean subtle oval fingernail reflection -->
    <path d="M 82 122 C 87 120, 92 123, 91 128 C 90 133, 85 133, 81 129 Z"
          fill="#FFFFFF" opacity="0.35" />
  </g>
</svg>