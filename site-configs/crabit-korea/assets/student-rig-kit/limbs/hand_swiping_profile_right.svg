<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260">
  <!-- KOREAN ANIME RIG: Right Hand 3/4 Profile Swiping / Tapping (Single Master Silhouette) -->
  <!-- Pure warm skin: #FFE3D1 | Contour: #E0A890 (2.5px) | Accents: #FCA5A5 (0.6 opacity) | Cuff: #2563EB / #1D4ED8 -->

  <!-- ========================================================================= -->
  <!-- MAIN RIG GROUP: Swiping Profile Hand                                      -->
  <!-- ========================================================================= -->
  <g id="hand_swiping_profile" data-socket-wrist="40 220" data-socket-touch="180 55">

    <!-- Wrist emergence from sleeve (under cuff) -->
    <path d="M 24 220 L 74 226 L 66 248 L 16 242 Z"
          fill="#FFE3D1" />

    <!-- MASTER UNIFIED ANIME HAND SILHOUETTE (Zero Seams, Zero Steps) -->
    <!-- Encompasses dorsal hand, proportional index finger (~75px, 30°), and curled fist block in ONE path -->
    <path d="M 32 216
             C 48 180, 76 138, 115 100
             C 134 82, 156 64, 172 52
             C 178 47, 184 50, 182 56
             C 180 62, 160 74, 142 88
             C 128 98, 122 104, 116 112
             C 134 114, 146 122, 144 134
             C 142 142, 134 148, 126 150
             C 136 154, 140 162, 136 172
             C 132 180, 124 184, 116 186
             C 122 190, 124 198, 116 204
             C 106 210, 88 206, 74 212
             C 70 216, 68 222, 70 226 Z"
          fill="#FFE3D1" stroke="#E0A890" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Clean, minimal interior dividing lines between folded fingers -->
    <path d="M 126 148 C 118 150, 110 152, 102 154"
          fill="none" stroke="#E0A890" stroke-width="2" stroke-linecap="round" />
    <path d="M 116 184 C 108 186, 100 188, 94 190"
          fill="none" stroke="#E0A890" stroke-width="2" stroke-linecap="round" />

    <!-- Folded Thumb resting comfortably across the palm block -->
    <path d="M 46 195
             C 64 168, 86 142, 106 134
             C 118 128, 130 130, 132 138
             C 134 146, 124 152, 110 154"
          fill="none" stroke="#E0A890" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Subtle thumb knuckle arc (#FCA5A5, opacity 0.6) -->
    <path d="M 102 138 C 106 142, 104 146, 100 148"
          fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Hero Index Finger Details (Exactly two subtle knuckle ticks) -->
    <!-- PIP joint tick -->
    <path d="M 144 76 C 148 79, 146 84, 141 87"
          fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <!-- DIP joint tick -->
    <path d="M 162 61 C 166 64, 164 69, 160 72"
          fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Clean oval fingernail reflection -->
    <path d="M 174 51 C 178 49, 181 51, 180 54 C 179 57, 175 57, 174 54 Z"
          fill="#FFFFFF" opacity="0.35" />

    <!-- Student Hoodie Sleeve Cuff entering bottom-left (x: 40, y: 220) -->
    <g id="sleeve_cuff_right">
      <!-- Main sleeve fabric -->
      <path d="M 6 260 L 26 216 C 31 206, 42 200, 56 205 L 80 216 C 90 220, 94 230, 88 242 L 74 260 Z"
            fill="#2563EB" stroke="#1D4ED8" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Ribbed cuff hem band -->
      <path d="M 26 216 C 36 204, 64 200, 80 216 L 85 224 C 68 206, 42 212, 32 224 Z"
            fill="#1D4ED8" stroke="#1D4ED8" stroke-width="1.5" stroke-linejoin="round" />
      <!-- Sleeve wrinkle accent -->
      <path d="M 30 238 C 42 232, 58 236, 68 248"
            fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" />
    </g>

  </g>
</svg>