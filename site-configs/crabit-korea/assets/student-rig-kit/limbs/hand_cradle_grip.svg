<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280">
  <!-- Decoupled Smartphone Grip Hand (Rear Fingers & Front Thumb Rig) -->

  <!-- ======================================================================== -->
  <!-- 1. HAND GRIP REAR (Rendered BEHIND Phone in Remotion)                   -->
  <!-- ======================================================================== -->
  <g id="hand_grip_rear">
    <!-- Sleeve Cuff: Charcoal Navy (#1E293B) at Bottom-Left -->
    <g id="rear_cuff_group" transform="translate(48, 256) rotate(-22)">
      <rect id="rear_cuff_base" x="-26" y="-9" width="54" height="18" rx="4" fill="#1E293B" stroke="#0F172A" stroke-width="1.8" />
      <line x1="-15" y1="-7" x2="-15" y2="7" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
      <line x1="-5" y1="-7" x2="-5" y2="7" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
      <line x1="5" y1="-7" x2="5" y2="7" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
      <line x1="15" y1="-7" x2="15" y2="7" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Wrist Column (#FFE3D1) entering from cuff -->
    <path id="rear_wrist_column" d="M 36 235 L 74 246 L 68 260 L 30 248 Z" fill="#FFE3D1" stroke="#E0A890" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Palm Supporting Mass (Behind phone, with natural deep web curve between thumb and index) -->
    <path id="rear_palm_mass" d="
      M 36 235
      C 38 200 44 175 52 160
      C 60 170 82 178 105 165
      C 128 152 145 118 156 82
      L 165 80
      C 170 120 170 180 162 215
      C 152 232 135 242 74 246
      Z"
      fill="#FFE3D1" stroke="#E0A890" stroke-width="2" stroke-linejoin="round" />

    <!-- Palm Shading behind device plane -->
    <path id="rear_palm_shade" d="M 36 235 C 38 200 44 175 52 160 C 60 170 82 178 105 165 L 102 185 C 80 196 60 215 74 246 Z" fill="#E0A890" opacity="0.3" />

    <!-- 4 Curled Fingers wrapping along Right Edge of device (x: 170..210, y: 70..220) -->
    <!-- 1. Index Finger (Curled at top, y: 76..112) -->
    <g id="rear_finger_index">
      <path id="index_curled_mesh" d="
        M 155 82
        C 168 76 190 78 196 86
        C 202 94 198 104 186 108
        C 174 110 160 106 156 102
        Z"
        fill="#FFE3D1" stroke="#E0A890" stroke-width="2" stroke-linejoin="round" />
      <line x1="176" y1="83" x2="184" y2="103" stroke="#FCA5A5" stroke-width="1.6" stroke-linecap="round" />
      <path d="M 184 78 Q 192 82 194 90" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.5" />
    </g>

    <!-- 2. Middle Finger (Longest reach, y: 110..148) -->
    <g id="rear_finger_middle">
      <path id="middle_curled_mesh" d="
        M 158 110
        C 176 108 204 112 210 122
        C 214 132 208 142 194 144
        C 180 146 164 142 160 138
        Z"
        fill="#FFE3D1" stroke="#E0A890" stroke-width="2" stroke-linejoin="round" />
      <line x1="186" y1="116" x2="196" y2="136" stroke="#FCA5A5" stroke-width="1.6" stroke-linecap="round" />
      <path d="M 194 112 Q 204 118 206 126" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.5" />
    </g>

    <!-- 3. Ring Finger (y: 146..184) -->
    <g id="rear_finger_ring">
      <path id="ring_curled_mesh" d="
        M 160 146
        C 174 144 198 148 202 158
        C 206 168 200 176 188 178
        C 176 180 162 176 158 172
        Z"
        fill="#FFE3D1" stroke="#E0A890" stroke-width="2" stroke-linejoin="round" />
      <line x1="182" y1="152" x2="190" y2="172" stroke="#FCA5A5" stroke-width="1.6" stroke-linecap="round" />
      <path d="M 190 148 Q 198 154 200 162" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.5" />
    </g>

    <!-- 4. Pinky Finger (Curled tightest at bottom, y: 182..218) -->
    <g id="rear_finger_pinky">
      <path id="pinky_curled_mesh" d="
        M 160 182
        C 172 180 188 184 192 192
        C 195 202 188 210 178 212
        C 168 214 158 210 156 206
        Z"
        fill="#FFE3D1" stroke="#E0A890" stroke-width="2" stroke-linejoin="round" />
      <line x1="174" y1="188" x2="182" y2="206" stroke="#FCA5A5" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 180 184 Q 188 188 190 196" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.5" />
    </g>

    <!-- Hypothenar Outer Palm Contour -->
    <path id="hypothenar_contour" d="M 158 212 C 152 226 138 238 74 246" fill="none" stroke="#E0A890" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ======================================================================== -->
  <!-- 2. HAND GRIP FRONT THUMB (Rendered IN FRONT of Phone in Remotion)       -->
  <!-- ======================================================================== -->
  <g id="hand_grip_front_thumb">
    <!-- Fleshy Thumb Pad wrapping around Left Edge of device (x: 35..85, y: 110..170) -->
    <!-- Soft arc silhouette with radius > 16px, zero sharp claws, zero floating balls -->
    <path id="thumb_pad_mesh" d="
      M 48 168
      C 36 156 34 134 44 120
      C 52 108 68 108 78 116
      C 86 124 88 142 82 154
      C 76 166 60 172 48 168
      Z"
      fill="#FFE3D1" stroke="#E0A890" stroke-width="2.2" stroke-linejoin="round" />

    <!-- Thumb Interphalangeal Flex Crease -->
    <path id="thumb_crease" d="M 50 144 Q 64 142 78 148" fill="none" stroke="#FCA5A5" stroke-width="1.8" stroke-linecap="round" />

    <!-- Fleshy Thumb Pad Catchlight -->
    <path id="thumb_pad_highlight" d="M 48 126 C 52 116 64 114 72 120" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.55" />

    <!-- Subtle Fingernail Arc Contour -->
    <path id="thumb_fingernail" d="M 62 114 Q 70 112 74 118" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- ======================================================================== -->
  <!-- 3. ANATOMICAL SOCKET MARKERS                                            -->
  <!-- ======================================================================== -->
  <!-- Wrist Joint Socket: (60, 250) -->
  <circle id="socket_wrist_joint" cx="60" cy="250" r="2.5" fill="none" opacity="0" />
  <!-- Phone Anchor Socket: (110, 140) Center of gravity for clamped smartphone -->
  <circle id="socket_phone_anchor" cx="110" cy="140" r="2.5" fill="none" opacity="0" />
</svg>
