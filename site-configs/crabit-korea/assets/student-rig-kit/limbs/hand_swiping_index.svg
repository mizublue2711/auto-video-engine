<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="220" height="260">
  <!-- Decoupled Swiping / Tapping Index Finger Hand Rig -->
  <g id="hand_swiping_index" data-pivot="40 220">
    <!-- ====================================================================== -->
    <!-- 1. WRIST & HOODIE CUFF BASE (Entering from Bottom-Left)               -->
    <!-- ====================================================================== -->
    <!-- Royal Blue Sleeve Stub (#2563EB) -->
    <path id="sleeve_stub" d="M 12 238 L 44 256 L 56 240 L 22 222 Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Dark Navy Ribbed Wrist Cuff (#1D4ED8) Angled Along Arm Axis -->
    <g id="wrist_cuff_group" transform="translate(34, 226) rotate(-30)">
      <rect id="wrist_cuff_base" x="-22" y="-8" width="44" height="16" rx="4" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1.8" />
      <line x1="-12" y1="-6" x2="-12" y2="6" stroke="#1E40AF" stroke-width="1.4" stroke-linecap="round" />
      <line x1="-4" y1="-6" x2="-4" y2="6" stroke="#1E40AF" stroke-width="1.4" stroke-linecap="round" />
      <line x1="4" y1="-6" x2="4" y2="6" stroke="#1E40AF" stroke-width="1.4" stroke-linecap="round" />
      <line x1="12" y1="-6" x2="12" y2="6" stroke="#1E40AF" stroke-width="1.4" stroke-linecap="round" />
    </g>

    <!-- Wrist Column emerging from cuff to palm base -->
    <path id="wrist_column" d="M 24 210 L 54 224 L 48 238 L 18 222 Z" fill="#FFE3D1" stroke="#E0A890" stroke-width="1.8" stroke-linejoin="round" />

    <!-- ====================================================================== -->
    <!-- 2. MASTER ANATOMICAL HAND MESH (Unified Dorsal Contour & Index Finger) -->
    <!-- ====================================================================== -->
    <!-- Seamless flow from wrist across dorsal hand into extended index finger (Touch Tip: 185, 45) -->
    <path id="master_hand_mesh" d="
      M 24 210
      C 32 178 50 148 76 128
      C 94 114 108 106 120 98
      C 136 86 156 70 172 56
      C 178 50 184 41 186 45
      C 189 49 187 56 182 62
      C 172 74 158 88 144 102
      C 134 112 126 118 122 122
      C 132 124 140 134 138 144
      C 136 152 128 158 120 158
      C 128 162 130 172 126 178
      C 122 184 114 188 104 186
      C 108 190 108 198 102 202
      C 96 206 86 206 76 210
      C 62 216 54 224 54 224
      Z"
      fill="#FFE3D1" stroke="#E0A890" stroke-width="2.2" stroke-linejoin="round" />

    <!-- Subtle Dorsal Catchlight Highlight along Upper Ridge to Fingertip -->
    <path id="index_dorsal_highlight" d="
      M 78 126
      C 102 110 130 90 156 68
      C 168 58 178 48 184 46"
      fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Delicate Fingernail Contour at Fingertip (185, 45) -->
    <path id="index_fingernail" d="M 178 47 Q 184 44 187 49" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.5" />

    <!-- Index Interphalangeal Knuckle Crease Ticks (#FCA5A5) -->
    <!-- PIP Joint Crease -->
    <line x1="140" y1="84" x2="148" y2="76" stroke="#FCA5A5" stroke-width="1.6" stroke-linecap="round" />
    <!-- DIP Joint Crease -->
    <line x1="164" y1="62" x2="172" y2="56" stroke="#FCA5A5" stroke-width="1.5" stroke-linecap="round" />

    <!-- ====================================================================== -->
    <!-- 3. CURLED FINGERS DETAIL FOLDS (Middle, Ring, Pinky)                   -->
    <!-- ====================================================================== -->
    <!-- Middle Finger Crease -->
    <path id="crease_middle_curled" d="M 124 136 Q 130 142 132 148" fill="none" stroke="#FCA5A5" stroke-width="1.5" stroke-linecap="round" />
    <!-- Ring Finger Crease -->
    <path id="crease_ring_curled" d="M 114 164 Q 120 170 122 176" fill="none" stroke="#FCA5A5" stroke-width="1.5" stroke-linecap="round" />
    <!-- Pinky Finger Crease -->
    <path id="crease_pinky_curled" d="M 96 192 Q 100 196 102 200" fill="none" stroke="#FCA5A5" stroke-width="1.4" stroke-linecap="round" />

    <!-- ====================================================================== -->
    <!-- 4. FOLDED THUMB RESTING ACROSS PALM                                    -->
    <!-- ====================================================================== -->
    <g id="folded_thumb">
      <path id="thumb_body" d="
        M 52 148
        C 62 142 78 144 90 150
        C 98 154 102 162 96 168
        C 88 174 76 174 66 170
        C 56 166 48 156 52 148
        Z"
        fill="#FFE3D1" stroke="#E0A890" stroke-width="2" stroke-linejoin="round" />
      <path id="thumb_crease" d="M 68 152 Q 78 156 84 162" fill="none" stroke="#FCA5A5" stroke-width="1.6" stroke-linecap="round" />
      <path id="thumb_highlight" d="M 60 148 Q 74 148 84 154" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.55" />
    </g>

    <!-- ====================================================================== -->
    <!-- 5. ANATOMICAL SOCKET & PIVOT MARKERS                                   -->
    <!-- ====================================================================== -->
    <!-- Wrist Joint Socket: (40, 220) -->
    <circle id="socket_wrist_joint" cx="40" cy="220" r="2.5" fill="none" opacity="0" />
    <!-- Touch Tip Target Socket: (185, 45) Magnetic Snap for Touchscreen Taps -->
    <circle id="socket_touch_tip" cx="185" cy="45" r="2.5" fill="none" opacity="0" />
    <!-- Index Knuckle Pivot: (110, 110) -->
    <circle id="pivot_index_knuckle" cx="110" cy="110" r="2.5" fill="none" opacity="0" />
  </g>
</svg>
