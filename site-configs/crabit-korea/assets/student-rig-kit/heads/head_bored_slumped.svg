<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Student Head Bored / Study Exhausted Rig Component (Fixed Anatomical Rig) -->
  <g id="head_bored_slumped" data-pivot="160 288">
    <!-- 1. Anatomical Neck Base (fill="#FFE3D1", height ~28px, flaring outward at bottom x: 139..181, y: 260..288) -->
    <g id="neck_group">
      <path id="neck_base" d="M 141 250 L 139 288 C 153 291 167 291 181 288 L 179 250 Z" fill="#FFE3D1" />
      <!-- Soft chin shadow & sternocleidomastoid collar guide -->
      <path d="M 141 254 C 153 264 167 264 179 254 L 179 262 C 167 272 153 272 141 262 Z" fill="#E0A890" opacity="0.45" />
      <line x1="154" y1="268" x2="151" y2="284" stroke="#E0A890" stroke-width="1.5" stroke-linecap="round" opacity="0.35" />
      <line x1="166" y1="268" x2="169" y2="284" stroke="#E0A890" stroke-width="1.5" stroke-linecap="round" opacity="0.35" />
    </g>

    <!-- 2. Skull & Head Base (Slightly slumped teen anime contour) -->
    <circle id="head_base" cx="160" cy="170" r="88" fill="#FFE3D1" />

    <!-- 3. Ears (Left and Right with inner creases) -->
    <g id="ears">
      <!-- Left Ear -->
      <circle cx="72" cy="170" r="13" fill="#FFE3D1" />
      <path d="M 72 166 Q 76 170 72 174" fill="none" stroke="#E0A890" stroke-width="2" stroke-linecap="round" />
      <!-- Right Ear -->
      <circle cx="248" cy="170" r="13" fill="#FFE3D1" />
      <path d="M 248 166 Q 244 170 248 174" fill="none" stroke="#E0A890" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- 4. Hair Assembly: Clean dark slate hair (#1E293B) with disheveled front fringe -->
    <g id="hair_assembly">
      <!-- Main volume & bangs contour -->
      <path id="hair_volume" d="M 70 170 C 65 58 105 48 160 48 C 215 48 255 58 250 170 C 245 138 230 110 210 105 C 185 110 160 135 130 140 C 100 142 85 125 70 170 Z" fill="#1E293B" />
      <!-- Left sideburn -->
      <path d="M 72 170 C 70 190 73 204 78 212 C 80 202 81 188 82 176 Z" fill="#1E293B" />
      <!-- Right sideburn -->
      <path d="M 248 170 C 250 190 247 204 242 212 C 240 202 239 188 238 176 Z" fill="#1E293B" />
      <!-- Subtle center bang strand -->
      <path d="M 134 139 Q 139 151 144 149 Q 146 142 148 137 Z" fill="#1E293B" />
    </g>

    <!-- 5. Cheeks: Soft circular blush pads (#FCA5A5, opacity 0.45) -->
    <g id="cheeks">
      <circle cx="112" cy="184" r="13" fill="#FCA5A5" opacity="0.45" />
      <circle cx="208" cy="184" r="13" fill="#FCA5A5" opacity="0.45" />
    </g>

    <!-- 6. Single Soft Cyan Sweat Bead on Temple (#38BDF8) -->
    <g id="temple_sweat_bead">
      <path d="M 98 148 C 103 141 109 148 103 157 C 98 162 93 156 98 148 Z" fill="#38BDF8" opacity="0.9" />
      <path d="M 99 150 Q 102 147 103 152" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none" />
    </g>

    <!-- 7. Eyebrows: Soft, clean, slightly furrowed downward arcs (stroke: #1E293B, stroke-width: 3.5px, round caps) -->
    <g id="eyebrows">
      <!-- Left brow -->
      <path d="M 106 147 Q 122 141 138 145" fill="none" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round" />
      <!-- Right brow -->
      <path d="M 182 145 Q 198 141 214 147" fill="none" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- 8. Slumped Eyes: Clean, elegant downward curved lashes (#1E293B) with subtle stress ticks -->
    <g id="eyes_exhausted">
      <!-- Left eye -->
      <path d="M 110 166 Q 124 172 138 166" fill="none" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round" />
      <line x1="110" y1="166" x2="106" y2="171" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />

      <!-- Right eye -->
      <path d="M 182 166 Q 196 172 210 166" fill="none" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round" />
      <line x1="210" y1="166" x2="214" y2="171" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- 9. Subtle Anime Nose (#E0A890) -->
    <path id="tired_nose" d="M 160 166 L 160 174 L 164 175" fill="none" stroke="#E0A890" stroke-width="2.2" stroke-linecap="round" />

    <!-- 10. Exhausted Mouth: Soft wavy flat line expressing study fatigue (#1E293B) -->
    <g id="exhausted_mouth">
      <path d="M 148 202 Q 154 199 160 202 Q 166 205 172 201" fill="none" stroke="#1E293B" stroke-width="2.8" stroke-linecap="round" />
      <path d="M 158 207 Q 160 208 162 207" fill="none" stroke="#E0A890" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
    </g>
  </g>
</svg>