<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Student Head 3/4 Confident View Rig Component -->
  <g id="head_34_confident" data-pivot="160 290">
    <!-- 1. Neck Column (fill="#FFE3D1", height ~24px, width 34px, natural angle, zero gaps into collar) -->
    <g id="neck_group">
      <path d="M 143 252 C 142 264 140 276 139 290 L 173 290 C 174 276 176 264 177 250 Z" fill="#FFE3D1" />
      <path d="M 143 252 C 153 262 165 262 177 250 L 175 258 C 163 268 151 268 141 258 Z" fill="#E2A888" opacity="0.4" />
    </g>

    <!-- 2. Skull & 3/4 Jawline Contour -->
    <!-- Head turned 3/4 to the right:
         - Left: rounded skull occiput & full round near cheekbone (radius ~75px equivalent)
         - Right: subtle far anime cheek curve tapering to chin at (172, 256) -->
    <g id="head_contour">
      <path id="jawline_base" d="M 155 70 C 102 70 78 104 78 160 C 78 190 88 214 105 232 C 122 250 146 258 172 256 C 196 254 218 238 228 214 C 236 196 236 178 232 162 C 228 148 222 128 208 100 C 190 76 172 70 155 70 Z" fill="#FFE3D1" />
    </g>

    <!-- 3. Left Ear (Near ear in 3/4 right view, clearly defined on left side with inner crease lines) -->
    <g id="ear_left">
      <circle cx="80" cy="165" r="13" fill="#FFE3D1" />
      <path d="M 78 159 Q 83 165 78 171" fill="none" stroke="#E2A888" stroke-width="2.2" stroke-linecap="round" />
    </g>

    <!-- 4. 3/4 Korean Side-Swept Slate-Black Hair (#1E293B) -->
    <!-- Exact color #1E293B, layered fringe swept dynamically across forehead toward the right,
         contouring cleanly around the back of the skull/occiput and sideburn framing the left ear -->
    <g id="hair_assembly">
      <path id="hair_side_swept" d="M 78 162 C 72 98 106 48 162 48 C 218 48 248 84 245 146 C 237 132 222 118 198 114 C 168 120 138 148 106 152 C 90 154 82 142 78 162 Z" fill="#1E293B" />
      <!-- Clean occiput contour behind left ear -->
      <path d="M 79 154 C 76 174 78 192 84 200 C 86 190 87 175 88 165 Z" fill="#1E293B" />
    </g>

    <!-- 5. Cheeks: Soft Rosy Blush Pad (#FCA5A5, opacity 0.55) -->
    <!-- Left cheek (near cheek): fuller round cheekbone with soft blush pad (#FCA5A5, opacity 0.55) -->
    <g id="cheeks_blush">
      <circle id="blush_left_near" cx="130" cy="190" r="14" fill="#FCA5A5" opacity="0.55" />
      <ellipse id="blush_right_far" cx="216" cy="186" rx="6.5" ry="9" fill="#FCA5A5" opacity="0.3" />
    </g>

    <!-- 6. Arched Eyebrows (#1E293B) in 3/4 Right Perspective -->
    <g id="eyebrows">
      <path id="eyebrow_left_near" d="M 118 140 Q 136 128 154 136" fill="none" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round" />
      <path id="eyebrow_right_far" d="M 186 136 Q 200 129 214 140" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- 7. 3/4 Facial Rig: Sparkling Confident Eyes (#0F172A) -->
    <g id="eyes_assembly">
      <!-- Near Eye (Left): Large, lively eye with starburst pupil glint matching "1. NEUTRAL READY" -->
      <g id="eye_left_near">
        <circle cx="136" cy="162" r="9.5" fill="#0F172A" />
        <circle cx="132.5" cy="158" r="3" fill="#FFFFFF" />
        <circle cx="138.5" cy="164" r="1.5" fill="#FFFFFF" />
      </g>
      <!-- Far Eye (Right): Slightly narrower in 3/4 perspective, perfectly aligned on eye-line axis -->
      <g id="eye_right_far">
        <ellipse cx="202" cy="162" rx="7" ry="9.5" fill="#0F172A" />
        <circle cx="199.5" cy="158" r="2.2" fill="#FFFFFF" />
        <circle cx="204" cy="164" r="1.1" fill="#FFFFFF" />
      </g>
    </g>

    <!-- 8. Nose: Minimalist subtle 3/4 nose tick mark (#E2A888 / soft shadow stroke) -->
    <g id="nose_group">
      <path id="nose_tick" d="M 172 164 L 172 176 L 178 178" fill="none" stroke="#E2A888" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- 9. Mouth: Cheerful, confident 3/4 open smile (#EF4444) angled with mouth perspective -->
    <g id="mouth_smile">
      <!-- Open mouth cavity (#EF4444) -->
      <path d="M 146 196 Q 176 230 206 196 Z" fill="#EF4444" />
      <!-- Crisp White Teeth arch -->
      <path d="M 150 197 Q 176 207 202 197 Q 176 201 150 197 Z" fill="#FFFFFF" />
      <!-- Soft Pink Tongue (#F87171) -->
      <path d="M 160 216 Q 176 208 192 216 C 188 226 164 226 160 216 Z" fill="#F87171" />
      <!-- Upper & lower lip defining contour stroke (#B91C1C) -->
      <path d="M 144 195 Q 176 232 208 195" fill="none" stroke="#B91C1C" stroke-width="2.2" stroke-linecap="round" />
    </g>
  </g>
</svg>