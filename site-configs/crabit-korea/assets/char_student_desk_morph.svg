<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" id="svg_student" preserveAspectRatio="xMidYMid meet">
  <!-- LAYER 1: Chair Backrest & Support (Behind the body) -->
  <g id="chair_backrest">
    <rect id="chair_back_cushion" x="370" y="440" width="260" height="170" rx="28" fill="#64748B" />
    <rect id="chair_back_inner" x="390" y="460" width="220" height="130" rx="18" fill="#475569" opacity="0.6" />
    <rect id="chair_pole" x="488" y="610" width="24" height="200" rx="6" fill="#334155" />
    <path id="chair_base" d="M 400 810 L 600 810 L 590 835 L 410 835 Z" fill="#334155" />
    <circle id="chair_wheel_left" cx="410" cy="843" r="10" fill="#1E293B" />
    <circle id="chair_wheel_center" cx="500" cy="843" r="10" fill="#1E293B" />
    <circle id="chair_wheel_right" cx="590" cy="843" r="10" fill="#1E293B" />
    <!-- Cushioned Seat Base -->
    <rect id="chair_seat_cushion" x="350" y="625" width="300" height="34" rx="14" fill="#334155" stroke="#1E293B" stroke-width="2" />
  </g>

  <!-- LAYER 2: Student Hips & Thighs (Sitting horizontally on chair seat) -->
  <g id="student_hips_thighs">
    <path id="thigh_left" d="M 360,630 L 475,630 L 470,685 L 350,685 Z" fill="#334155" />
    <path id="thigh_right" d="M 525,630 L 640,630 L 650,685 L 530,685 Z" fill="#334155" />
  </g>

  <!-- LAYER 3: Calves & Feet (Descending vertically at 90-degree angle, sneakers grounded at y=900) -->
  <g id="student_calves_feet">
    <g id="student_legs">
      <path id="calf_left" d="M 375,685 L 445,685 L 435,890 L 370,890 Z" fill="#334155" />
      <path id="calf_right" d="M 555,685 L 625,685 L 630,890 L 565,890 Z" fill="#334155" />
      <path id="crease_left" stroke="#1E293B" stroke-width="3" stroke-linecap="round" d="M 405,730 L 405,860" />
      <path id="crease_right" stroke="#1E293B" stroke-width="3" stroke-linecap="round" d="M 595,730 L 595,860" />
      <!-- White Socks -->
      <rect id="sock_left" x="374" y="884" width="60" height="14" rx="3" fill="#FFFFFF" />
      <rect id="sock_right" x="566" y="884" width="60" height="14" rx="3" fill="#FFFFFF" />
    </g>

    <!-- Clean White Student Sneakers resting flat on floor plane at y=900 -->
    <g id="student_shoes">
      <path id="shoe_left_upper" d="M 350,900 L 445,900 C 455,900 455,876 435,876 L 395,876 C 370,876 358,884 350,900 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
      <rect id="shoe_left_sole" x="345" y="900" width="105" height="14" rx="4" fill="#94A3B8" />
      <rect id="shoe_left_tread" x="345" y="909" width="105" height="5" rx="2" fill="#64748B" />
      <path id="shoe_left_accent" d="M 385,886 L 420,886" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" />

      <path id="shoe_right_upper" d="M 555,900 L 650,900 C 660,900 660,876 640,876 L 600,876 C 575,876 563,884 555,900 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
      <rect id="shoe_right_sole" x="550" y="900" width="105" height="14" rx="4" fill="#94A3B8" />
      <rect id="shoe_right_tread" x="550" y="909" width="105" height="5" rx="2" fill="#64748B" />
      <path id="shoe_right_accent" d="M 580,886 L 615,886" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- LAYER 4: Torso Hoodie (Sloping downward naturally at 20 degrees, behind desk surface) -->
  <g id="student_torso_group">
    <path id="student_hoodie_body" fill="#2563EB" d="M 360,670 L 360,600 C 360,565 410,555 500,555 C 590,555 640,565 640,600 L 640,670 Z" />
    <path id="student_hoodie_pocket" d="M 440,610 L 560,610 C 560,650 540,665 500,665 C 460,665 440,650 440,610 Z" fill="#1D4ED8" />
    <path id="hoodie_string_left" d="M 480,565 L 478,610" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <circle id="hoodie_knot_left" cx="478" cy="612" r="4" fill="#FFFFFF" />
    <path id="hoodie_string_right" d="M 520,565 L 522,610" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <circle id="hoodie_knot_right" cx="522" cy="612" r="4" fill="#FFFFFF" />
  </g>

  <!-- LAYER 5: 15-Degree Oblique Desk Surface (Overlaps & Clips the Waist) -->
  <g id="student_desk_prop">
    <!-- Desk Legs anchoring to ground -->
    <rect id="desk_legs" x="220" y="650" width="28" height="250" rx="6" fill="#94A3B8" />
    <rect id="desk_legs_right" x="752" y="650" width="28" height="250" rx="6" fill="#94A3B8" />
    <rect id="desk_crossbar" x="220" y="770" width="560" height="16" rx="4" fill="#CBD5E1" />
    <rect id="desk_foot_left" x="205" y="895" width="58" height="12" rx="4" fill="#64748B" />
    <rect id="desk_foot_right" x="737" y="895" width="58" height="12" rx="4" fill="#64748B" />

    <!-- 15-Degree Oblique Desk Top Surface: Top width 640px, bottom width 700px, depth 60px -->
    <polygon id="desk_surface" points="180,590 820,590 850,650 150,650" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.5" />
    <polygon id="desk_top_highlight" points="180,590 820,590 823,596 177,596" fill="#E2E8F0" />
    <!-- Desk Front Lip -->
    <polygon id="desk_front_lip" points="150,650 850,650 850,672 150,672" fill="#94A3B8" />

    <!-- Stationery resting on oblique desk plane -->
    <g id="desk_stationery">
      <polygon id="desk_notebook" points="435,602 565,602 575,638 425,638" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <line x1="500" y1="602" x2="500" y2="638" stroke="#CBD5E1" stroke-width="2" />
      <line x1="445" y1="612" x2="490" y2="612" stroke="#E2E8F0" stroke-width="2" />
      <line x1="442" y1="622" x2="490" y2="622" stroke="#E2E8F0" stroke-width="2" />
      <line x1="510" y1="612" x2="555" y2="612" stroke="#E2E8F0" stroke-width="2" />
      <line x1="510" y1="622" x2="558" y2="622" stroke="#E2E8F0" stroke-width="2" />
      <rect id="desk_pen" x="590" y="618" width="45" height="6" rx="3" fill="#3B82F6" transform="rotate(-6 610 620)" />
    </g>
  </g>

  <!-- LAYER 6: Forearms Resting on Top of Desk Surface -->
  <g id="student_arms_resting_on_desk">
    <path id="forearm_left" d="M 360,600 Q 350,625 410,626 L 475,632" fill="none" stroke="#2563EB" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <path id="forearm_left_cuff" d="M 370,610 Q 420,615 470,628" fill="none" stroke="#1D4ED8" stroke-width="28" stroke-linecap="round" />
    <path id="forearm_right" d="M 640,600 Q 650,625 590,626 L 525,632" fill="none" stroke="#2563EB" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <path id="forearm_right_cuff" d="M 630,610 Q 580,615 530,628" fill="none" stroke="#1D4ED8" stroke-width="28" stroke-linecap="round" />
    <circle id="hand_left" cx="475" cy="630" r="16" fill="#FFE3D1" />
    <circle id="hand_right" cx="525" cy="630" r="16" fill="#FFE3D1" />
  </g>

  <!-- LAYER 7: Natural Distinct Neck Column (fill="#FFE3D1", height 28px) -->
  <g id="student_neck">
    <rect id="neck_column" x="482" y="538" width="36" height="28" rx="6" fill="#FFE3D1" />
    <path id="neck_shadow" d="M 482,538 L 518,538 L 518,548 C 500,554 490,554 482,548 Z" fill="#F5CCA8" />
  </g>

  <!-- LAYER 8: Head Morph (Fixed Head Skull & Hair, Only Inner Face Swaps) -->
  <g id="student_head_morph">
    <!-- Head State A: Bored / Slumping -->
    <g id="student_head_bored" opacity="1">
      <circle id="head_circle_bored" cx="500" cy="450" r="95" fill="#FFE3D1" />
      <circle id="ear_bored_left" cx="405" cy="450" r="15" fill="#FFE3D1" />
      <circle id="ear_bored_right" cx="595" cy="450" r="15" fill="#FFE3D1" />
      <!-- Unified Hair: Clean Korean side-swept fringe in #1E293B -->
      <path id="hair_neat_bored" fill="#1E293B" d="M 400 460 C 395 345 435 330 500 330 C 565 330 605 345 600 460 C 595 430 580 398 560 390 C 532 395 505 422 470 428 C 442 430 420 412 405 438 Z" />
      <circle id="blush_left" cx="440" cy="465" r="13" fill="#FF9B9B" opacity="0.4" />
      <circle id="blush_right" cx="560" cy="465" r="13" fill="#FF9B9B" opacity="0.4" />
      <path id="brow_bored_left" stroke="#1E293B" stroke-width="5" stroke-linecap="round" fill="none" d="M 440 420 Q 458 430 475 426" />
      <path id="brow_bored_right" stroke="#1E293B" stroke-width="5" stroke-linecap="round" fill="none" d="M 525 426 Q 542 430 560 420" />
      <path id="eyes_sleepy_slanted" stroke="#334155" stroke-width="6" stroke-linecap="round" fill="none" d="M 442 438 Q 458 445 474 440 M 526 440 Q 542 445 558 438" />
      <path id="nose_bored" stroke="#E2A888" stroke-width="3" stroke-linecap="round" fill="none" d="M 500,444 L 500,454 L 505,455" />
      <path id="mouth_frown" stroke="#334155" stroke-width="5" stroke-linecap="round" fill="none" d="M 478 485 Q 500 475 522 482" />
      <path id="sweat_drop_bored" d="M 575 425 C 568 425 565 431 568 438 C 571 445 578 445 581 438 C 584 431 581 425 575 425 Z" fill="#60A5FA" opacity="0.8" />
    </g>

    <!-- Head State B: Excited / Sparkling -->
    <g id="student_head_excited" opacity="0">
      <circle id="head_circle_excited" cx="500" cy="450" r="95" fill="#FFE3D1" />
      <circle id="ear_excited_left" cx="405" cy="450" r="15" fill="#FFE3D1" />
      <circle id="ear_excited_right" cx="595" cy="450" r="15" fill="#FFE3D1" />
      <path id="hair_neat_excited" fill="#1E293B" d="M 400 460 C 395 345 435 330 500 330 C 565 330 605 345 600 460 C 595 430 580 398 560 390 C 532 395 505 422 470 428 C 442 430 420 412 405 438 Z" />
      <circle id="blush_excited_left" cx="438" cy="462" r="15" fill="#FCA5A5" opacity="0.85" />
      <circle id="blush_excited_right" cx="562" cy="462" r="15" fill="#FCA5A5" opacity="0.85" />
      <path id="brow_excited_left" stroke="#1E293B" stroke-width="5" stroke-linecap="round" fill="none" d="M 440 415 Q 458 405 475 414" />
      <path id="brow_excited_right" stroke="#1E293B" stroke-width="5" stroke-linecap="round" fill="none" d="M 525 414 Q 542 405 560 415" />
      <circle id="eye_left_sparkle" cx="462" cy="436" r="10" fill="#0F172A" />
      <circle id="eye_left_catchlight" cx="459" cy="432" r="3" fill="#FFFFFF" />
      <circle id="eye_left_catchlight_sub" cx="465" cy="438" r="1.8" fill="#FFFFFF" />
      <circle id="eye_right_sparkle" cx="538" cy="436" r="10" fill="#0F172A" />
      <circle id="eye_right_catchlight" cx="535" cy="432" r="3" fill="#FFFFFF" />
      <circle id="eye_right_catchlight_sub" cx="541" cy="438" r="1.8" fill="#FFFFFF" />
      <path id="nose_excited" stroke="#E2A888" stroke-width="3" stroke-linecap="round" fill="none" d="M 500,442 L 500,452 L 505,453" />
      <path id="mouth_wide_smile" fill="#EF4444" d="M 470,468 Q 500,500 530,468 Z" />
      <path id="teeth_excited" fill="#FFFFFF" d="M 476,469 Q 500,478 524,469 Q 500,472 476,469 Z" />
      <path id="tongue_excited" fill="#F87171" d="M 488,488 Q 500,480 512,488 C 508,498 492,498 488,488 Z" />
      <path id="smile_outline" stroke="#B91C1C" stroke-width="2.5" stroke-linecap="round" fill="none" d="M 468,467 Q 500,502 532,467" />
      <path id="sparkle_star_left" fill="#F59E0B" d="M 330 360 Q 330 380 310 380 Q 330 380 330 400 Q 330 380 350 380 Q 330 380 330 360 Z" />
      <circle id="sparkle_dot_left" cx="300" cy="350" r="5" fill="#38BDF8" />
      <path id="sparkle_star_right" fill="#F59E0B" d="M 670 340 Q 670 365 645 365 Q 670 365 670 390 Q 670 365 695 365 Q 670 365 670 340 Z" />
      <circle id="sparkle_dot_right" cx="705" cy="405" r="6" fill="#10B981" />
      <path id="sparkle_star_top" fill="#00E5FF" d="M 500 240 Q 500 255 485 255 Q 500 255 500 270 Q 500 255 515 255 Q 500 255 500 240 Z" />
    </g>
  </g>
</svg>
