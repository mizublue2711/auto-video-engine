<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" id="prop_icon_book_sparkle" preserveAspectRatio="xMidYMid meet">
  <!-- Popping Golden Stars & Sparkles (Emerging upwards from open pages) -->
  <g id="book_sparkles_burst">
    <!-- Center Top Large 4-Point Star (Golden Yellow) -->
    <path id="star_center_large" d="M 250 60 Q 250 95 220 95 Q 250 95 250 130 Q 250 95 280 95 Q 250 95 250 60 Z" fill="#FFB800" />
    <circle id="star_center_core" cx="250" cy="95" r="5" fill="#FFFFFF" />

    <!-- Left High Medium Star -->
    <path id="star_left_med" d="M 170 110 Q 170 130 152 130 Q 170 130 170 150 Q 170 130 188 130 Q 170 130 170 110 Z" fill="#FFB800" />

    <!-- Right High Medium Star -->
    <path id="star_right_med" d="M 330 110 Q 330 130 312 130 Q 330 130 330 150 Q 330 130 348 130 Q 330 130 330 110 Z" fill="#FFB800" />

    <!-- Left Low Small Star -->
    <path id="star_left_small" d="M 105 170 Q 105 182 94 182 Q 105 182 105 194 Q 105 182 116 182 Q 105 182 105 170 Z" fill="#38BDF8" />

    <!-- Right Low Small Star -->
    <path id="star_right_small" d="M 395 170 Q 395 182 384 182 Q 395 182 395 194 Q 395 182 406 182 Q 395 182 395 170 Z" fill="#34D399" />

    <!-- Floating Sparkle Orbs / Dots -->
    <circle id="dot_orbit_1" cx="205" cy="75" r="6" fill="#34D399" />
    <circle id="dot_orbit_2" cx="295" cy="75" r="6" fill="#FB7185" />
    <circle id="dot_orbit_3" cx="130" cy="155" r="5" fill="#FFB800" />
    <circle id="dot_orbit_4" cx="370" cy="155" r="5" fill="#FFB800" />
    <circle id="dot_orbit_5" cx="250" cy="155" r="7" fill="#38BDF8" />
  </g>

  <!-- Open Book Main Structure (Centered at 250, 275, bounding around center 250, 250) -->
  <g id="book_main_structure">
    <!-- Book Hardcover Backing (Sky Blue) -->
    <path id="book_hardcover_back" d="M 85 345 C 130 325 210 325 244 350 L 250 355 L 256 350 C 290 325 370 325 415 345 C 424 350 430 360 426 370 C 422 380 410 385 400 380 C 360 362 290 360 256 385 C 252 388 248 388 244 385 C 210 360 140 362 100 380 C 90 385 78 380 74 370 C 70 360 76 350 85 345 Z" fill="#38BDF8" />

    <!-- Book Spine Rib (Soft Mint) -->
    <path id="book_spine_joint" d="M 238 358 C 246 352 254 352 262 358 L 262 388 C 254 394 246 394 238 388 Z" fill="#34D399" />

    <!-- Stacked Pages Thickness / Base Shadow Blocks -->
    <path id="page_block_left" d="M 98 335 C 145 315 215 315 246 340 L 246 358 C 215 333 145 333 98 353 Z" fill="#CBD5E1" />
    <path id="page_block_right" d="M 402 335 C 355 315 285 315 254 340 L 254 358 C 285 333 355 333 402 353 Z" fill="#CBD5E1" />

    <!-- Middle Page Spread (Soft Mint Accented Layer) -->
    <path id="page_middle_left" d="M 100 320 C 150 295 215 295 246 325 L 246 345 C 215 315 150 315 100 340 Z" fill="#E2E8F0" />
    <path id="page_middle_right" d="M 400 320 C 350 295 285 295 254 325 L 254 345 C 285 315 350 315 400 340 Z" fill="#E2E8F0" />

    <!-- Top Crisp Pages Spread (Clean White with rounded corners) -->
    <!-- Left Top Page Wing -->
    <path id="page_top_left" d="M 105 235 C 160 215 215 230 246 255 L 246 335 C 215 305 155 295 105 320 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" stroke-linejoin="round" />
    <!-- Right Top Page Wing -->
    <path id="page_top_right" d="M 395 235 C 340 215 285 230 254 255 L 254 335 C 285 305 345 295 395 320 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" stroke-linejoin="round" />

    <!-- Bookmark Ribbon Draping Down (Coral #FB7185) -->
    <path id="bookmark_ribbon" d="M 244 260 L 244 380 L 250 372 L 256 380 L 256 260 Z" fill="#FB7185" />

    <!-- Text / Illustration Lines on Left Page -->
    <rect id="text_line_left_1" x="135" y="248" width="80" height="8" rx="4" fill="#38BDF8" opacity="0.8" />
    <rect id="text_line_left_2" x="130" y="266" width="85" height="7" rx="3.5" fill="#34D399" opacity="0.8" />
    <rect id="text_line_left_3" x="140" y="284" width="70" height="7" rx="3.5" fill="#CBD5E1" />

    <!-- Diagram / Content Elements on Right Page -->
    <circle id="page_illustration_badge" cx="300" cy="270" r="14" fill="#FFB800" />
    <path id="page_illustration_check" d="M 294 270 L 298 274 L 306 266" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect id="text_line_right_1" x="325" y="260" width="45" height="7" rx="3.5" fill="#38BDF8" opacity="0.8" />
    <rect id="text_line_right_2" x="325" y="274" width="35" height="7" rx="3.5" fill="#34D399" opacity="0.8" />
    <rect id="text_line_right_3" x="285" y="294" width="80" height="7" rx="3.5" fill="#CBD5E1" />
  </g>
</svg>
