<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" id="prop_chalkboard_empty_master" preserveAspectRatio="xMidYMid meet">
  <!-- ========================================================================== -->
  <!-- FOUNDRY ASSET: Blank CSAT Chalkboard Master Frame (De-Baked Vector Canvas) -->
  <!-- Spec: 1200x700, 100% vector, zero raster, zero blur, blank drawing surface   -->
  <!-- ========================================================================== -->

  <!-- Outer Frame & Structural Mounting -->
  <g id="chalkboard_outer_frame">
    <!-- Base Outer Contour: Dark Slate (#0F172A) & Aluminum Bezel (#1E293B) -->
    <rect id="frame_contour" x="8" y="8" width="1184" height="650" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="8" stroke-linejoin="round" />
    <rect id="frame_inner_lip" x="22" y="22" width="1156" height="622" rx="6" fill="#1E293B" stroke="#334155" stroke-width="2" />

    <!-- Corner Joint Reinforcements -->
    <circle id="fastener_tl" cx="20" cy="20" r="4" fill="#475569" stroke="#0F172A" stroke-width="1.5" />
    <circle id="fastener_tr" cx="1180" cy="20" r="4" fill="#475569" stroke="#0F172A" stroke-width="1.5" />
    <circle id="fastener_bl" cx="20" cy="646" r="4" fill="#475569" stroke="#0F172A" stroke-width="1.5" />
    <circle id="fastener_br" cx="1180" cy="646" r="4" fill="#475569" stroke="#0F172A" stroke-width="1.5" />
  </g>

  <!-- Deep Matte Green Chalkboard Canvas (100% De-baked & Blank) -->
  <g id="chalkboard_canvas">
    <rect id="board_surface_matte" x="30" y="30" width="1140" height="606" rx="4" fill="#064E3B" />
  </g>

  <!-- Chalk Tray Shelf & Accessories -->
  <g id="chalk_tray_assembly">
    <!-- Bottom Tray Bracket -->
    <rect id="tray_shelf" x="60" y="648" width="1080" height="26" rx="4" fill="#1E293B" stroke="#0F172A" stroke-width="2" />
    <line id="tray_groove" x1="72" y1="652" x2="1128" y2="652" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />

    <!-- 2 Static 2D Vector Chalk Pieces -->
    <g id="chalk_pieces">
      <!-- White Chalk Stick (Pure vector block) -->
      <rect id="chalk_stick_white" x="550" y="656" width="36" height="8" rx="2" fill="#FFFFFF" opacity="0.95" />
      <!-- Yellow Chalk Stick (Pure vector block) -->
      <rect id="chalk_stick_yellow" x="598" y="656" width="32" height="8" rx="2" fill="#FEF08A" />
    </g>
  </g>
</svg>
