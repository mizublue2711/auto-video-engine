<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" id="prop_desk_hagwon" preserveAspectRatio="xMidYMid meet">
  <!-- ========================================================================== -->
  <!-- LAYER 1 (Z-Back): Desk Rear Frame, Back Steel Legs, and Floor Shadow       -->
  <!-- ========================================================================== -->
  <g id="desk_rear_frame">
    <!-- Contact Floor Shadow beneath the entire desk unit -->
    <ellipse id="desk_floor_shadow" cx="300" cy="480" rx="250" ry="12" fill="#94A3B8" opacity="0.3" />

    <!-- Left Rear Steel Tubular Leg -->
    <rect id="desk_rear_leg_left" x="92" y="160" width="18" height="312" rx="3" fill="#94A3B8" stroke="#64748B" stroke-width="1.5" />
    <rect id="desk_rear_foot_left" x="88" y="470" width="26" height="8" rx="2" fill="#475569" />

    <!-- Right Rear Steel Tubular Leg -->
    <rect id="desk_rear_leg_right" x="490" y="160" width="18" height="312" rx="3" fill="#94A3B8" stroke="#64748B" stroke-width="1.5" />
    <rect id="desk_rear_foot_right" x="486" y="470" width="26" height="8" rx="2" fill="#475569" />

    <!-- Rear Structural Metal Crossbar Bracing -->
    <rect id="desk_rear_crossbar" x="92" y="250" width="416" height="12" rx="2" fill="#94A3B8" opacity="0.8" />
  </g>

  <!-- ========================================================================== -->
  <!-- LAYER 2 (Z-Front): Modesty Panel, Front Legs, Wooden Tabletop, Accessories -->
  <!-- ========================================================================== -->
  <g id="desk_foreground_block">
    <!-- Solid Modesty Panel (Tấm ván yếm chắn kín gầm bàn che chân học sinh) -->
    <!-- Extends from underneath tabletop (y=175) down to 20px above floor (y=460) -->
    <path id="desk_modesty_panel" d="M 68,175 L 532,175 L 532,460 L 68,460 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2" />

    <!-- Architectural Bevel & Structural Recess Grooves (Solid opaque fills) -->
    <path id="desk_modesty_inner_recess" d="M 90,195 L 510,195 L 510,440 L 90,440 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" />
    <line id="desk_modesty_groove_top" x1="90" y1="225" x2="510" y2="225" stroke="#CBD5E1" stroke-width="1.5" />
    <line id="desk_modesty_groove_bottom" x1="90" y1="410" x2="510" y2="410" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Steel Front Tubular Legs & Protective Rubber Feet -->
    <g id="desk_front_legs_group">
      <!-- Left Front Leg -->
      <path id="desk_front_legs" d="M 48,168 L 72,168 L 72,472 L 48,472 Z M 528,168 L 552,168 L 552,472 L 528,472 Z" fill="#64748B" stroke="#475569" stroke-width="1.5" />
      <rect id="desk_front_foot_left" x="44" y="470" width="32" height="10" rx="3" fill="#334155" />
      <rect id="desk_front_foot_right" x="524" y="470" width="32" height="10" rx="3" fill="#334155" />
    </g>

    <!-- Warm Beech/Oak Wooden Tabletop (15-Degree Oblique Perspective) -->
    <g id="desk_tabletop_group">
      <!-- Top Surface Plane (Depth trapezoid) -->
      <path id="desk_tabletop" d="M 75,80 L 525,80 L 575,152 L 25,152 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" stroke-linejoin="round" />

      <!-- Subtle Oak/Beech Woodgrain Contours -->
      <path id="desk_woodgrain_contour_1" d="M 115,104 Q 280,98 485,108" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" />
      <path id="desk_woodgrain_contour_2" d="M 85,128 Q 300,120 515,132" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" />

      <!-- Front Bevel Thickness Rim -->
      <path id="desk_front_bevel" d="M 25,152 L 575,152 C 580,152 584,156 582,161 L 576,174 C 574,177 571,178 567,178 L 33,178 C 29,178 26,177 24,174 L 18,161 C 16,156 20,152 25,152 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" stroke-linejoin="round" />
      <line id="desk_bevel_edge_highlight" x1="26" y1="153" x2="574" y2="153" stroke="#FFFFFF" stroke-width="2" />
      <line id="desk_bevel_bottom_shadow" x1="33" y1="177" x2="567" y2="177" stroke="#94A3B8" stroke-width="1.5" />
    </g>

    <!-- Desk Surface Accessories (Neatly placed notebook and pen) -->
    <g id="desk_accessories">
      <!-- Blue Study Notebook (#3B82F6) -->
      <g id="accessory_notebook">
        <polygon id="notebook_cover" points="120,98 205,98 222,142 137,142" fill="#3B82F6" stroke="#2563EB" stroke-width="1.5" />
        <polygon id="notebook_inner_page" points="124,101 201,101 217,139 140,139" fill="#FFFFFF" />
        <line id="notebook_spine" x1="120" y1="98" x2="137" y2="142" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round" />
        <line x1="148" y1="112" x2="195" y2="112" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" />
        <line x1="151" y1="122" x2="200" y2="122" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" />
        <line x1="154" y1="132" x2="205" y2="132" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" />
      </g>

      <!-- Sleek Red Ballpoint / Stylus Pen (#EF4444) -->
      <g id="accessory_pen">
        <path id="pen_body" d="M 240,136 L 285,136" stroke="#EF4444" stroke-width="5" stroke-linecap="round" />
        <polygon id="pen_metal_tip" points="234,136 240,133.5 240,138.5" fill="#94A3B8" />
        <line id="pen_clip" x1="270" y1="133" x2="284" y2="133" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round" />
      </g>
    </g>
  </g>
</svg>
