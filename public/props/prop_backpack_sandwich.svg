<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" width="360" height="420">
  <!-- Modular Backpack Sandwich Rig (Rear Pack & Front Straps) -->

  <!-- ======================================================================== -->
  <!-- LAYER 1: REAR PACK (Z-Index: 10 - Rendered Behind Torso)                -->
  <!-- ======================================================================== -->
  <g id="backpack_rear_pack" data-z-index="10">
    <!-- Top Webbing Loop -->
    <path id="backpack_handle" d="M 72 64 C 72 38 98 38 98 68" fill="none" stroke="#D97706" stroke-width="6" stroke-linecap="round" />

    <!-- Main Backpack Body: Nestled snugly behind left back contour (x: 40..130, y: 80..320) -->
    <path id="backpack_main_body" d="M 98 76 C 62 72 38 104 34 165 C 28 232 36 298 68 335 C 90 360 115 350 120 326 L 118 150 Z" fill="#F59E0B" stroke="#D97706" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Side Gusset Depth Shadow (#D97706) -->
    <path id="backpack_shade_gusset" d="M 34 165 C 28 232 36 298 68 335 C 80 312 90 205 98 115 C 66 110 44 132 34 165 Z" fill="#D97706" opacity="0.55" />

    <!-- Exterior Front Zipper Pocket -->
    <rect id="backpack_pocket" x="40" y="192" width="46" height="82" rx="9" fill="#D97706" stroke="#B45309" stroke-width="2.2" />
    <line id="backpack_zipper" x1="46" y1="216" x2="80" y2="216" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" />

    <!-- Reflector Charm Tag -->
    <circle id="backpack_charm_ring" cx="58" cy="294" r="3.5" fill="#FBBF24" />
    <polygon id="backpack_charm_gem" points="58,298 65,306 62,316 54,316 51,306" fill="#00E5FF" stroke="#38BDF8" stroke-width="1.2" />
  </g>

  <!-- ======================================================================== -->
  <!-- LAYER 2: FRONT STRAPS (Z-Index: 30 - Rendered In Front of Torso)        -->
  <!-- ======================================================================== -->
  <g id="backpack_front_straps" data-z-index="30">
    <!-- Right Shoulder Strap Peak (over right shoulder slope) -->
    <path id="strap_shoulder_right" d="M 218 50 C 224 64 232 78 242 90" fill="none" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round" />
    <path id="strap_shoulder_right_trim" d="M 220 52 C 226 66 234 80 244 92" fill="none" stroke="#CBD5E1" stroke-width="1.8" stroke-linecap="round" />

    <!-- Main Left Shoulder Harness Strap: Draping over left shoulder and across ribcage -->
    <path id="strap_shoulder_left" d="M 112 56 C 124 115 152 205 180 285 C 190 318 186 342 180 358" fill="none" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Strap Shadow / Depth Trim -->
    <path id="strap_shoulder_left_trim" d="M 116 58 C 128 117 156 207 184 287 C 194 320 190 342 184 358" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />

    <!-- Horizontal Sternum Cross Strap -->
    <path id="strap_sternum_cross" d="M 158 198 Q 192 206 234 216" fill="none" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round" />

    <!-- Minimalist Chest Clip Buckle Accent (#94A3B8) -->
    <rect id="sternum_buckle_frame" x="150" y="190" width="18" height="16" rx="3" fill="#94A3B8" stroke="#64748B" stroke-width="1.8" />
    <rect id="sternum_buckle_core" x="155" y="194" width="8" height="8" rx="1.5" fill="#334155" />
    <!-- Webbing Tension Slider -->
    <rect id="sternum_slider" x="200" y="204" width="10" height="9" rx="2" fill="#64748B" />
  </g>

  <!-- Torso Mount Socket Anchor: (180, 42) for 1:1 Sandwich Registration -->
  <circle id="socket_torso_mount" cx="180" cy="42" r="2.5" fill="none" opacity="0" />
</svg>
